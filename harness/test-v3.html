<script>
"use strict";
window.SUITE_PAGE = 'v3';

async function main() {
  const OC = window.OC;

  // T21 — the ellipse correction (conic.js). A camera off the screen normal
  // leaves every ring's presumed circle on an ELLIPSE registration didn't
  // absorb: the ring fallback is a similarity by design, and the finder
  // affine is fit to the tiny central fiducial while perspective divergence
  // grows with radius. The static k=2 lands ON a data harmonic and beats
  // against the rotating modulation — the walk-7/8 outer-ring wreckage
  // (carriers above AND below nominal, outermost first: the tilt term grows
  // as e·r0, data amplitudes stay flat). Geometry here: register on the
  // UNWARPED frame (a perfect similarity with zero knowledge of the warp —
  // the ring-reg field case, fully deterministic), then decode frames warped
  // by an area-preserving 20° tilt proxy (area-preserving because real
  // registration measures scale from the warped rings themselves; only the
  // RATIO survives as residual).
  await tick("T21: ellipse correction — rendering + warping the tilt stream…");
  {
    const p21 = OC.profile.defaultProfile({
      render: { size_px: 768, scale_px_per_unit: 124 },
      preamble_symbols: 4
    });
    const seq21 = OC.emission.renderSequence(p21, 152, {});
    const tau = 20 * Math.PI / 180, al = 30 * Math.PI / 180;
    const ca = Math.cos(al), sa = Math.sin(al);
    const s1 = 1 / Math.sqrt(Math.cos(tau)), s2 = Math.sqrt(Math.cos(tau));
    const M21 = [ca * ca * s1 + sa * sa * s2, ca * sa * (s1 - s2),
                 ca * sa * (s1 - s2), sa * sa * s1 + ca * ca * s2];
    const warped = seq21.frames.map((fr, i) => ({ f: i, img: OC.degrade.warpAffine(fr.img, M21) }));
    const regClean = seq21.frames[0].img;

    await tick("T21: decoding WITHOUT the correction (must break)…");
    const rOff = OC.pipeline.decodeSequence(warped, p21, { aligned: true, registerOn: regClean, conic: false });
    const brokeDet = rOff.error ? rOff.error :
      [0, 1, 2].map(L => "L" + L + ":" + fmt(layerResult(rOff, 0, L))).join("  ");
    const A0off = rOff.error ? null : layerResult(rOff, 0, 0);
    const broke = !!rOff.error || !A0off || !A0off.present || !!A0off.error ||
      (typeof A0off.ser === "number" && A0off.ser > 0.05);
    record("T21 without correction: 20° tilt residual under similarity registration wrecks the outer base ring (static k=2 ≈ 2× the data amplitude)",
      broke, brokeDet);

    await tick("T21: decoding WITH the correction…");
    const rOn = OC.pipeline.decodeSequence(warped, p21, { aligned: true, registerOn: regClean });
    const con = rOn.error ? null : rOn.emitters[0].conic;
    let okOn = !rOn.error;
    const detOn = rOn.error ? rOn.error : [0, 1, 2].map(L => {
      const A = layerResult(rOn, 0, L);
      if (!(A.present && A.ser === 0)) okOn = false;
      return "L" + L + ":" + fmt(A);
    }).join("  ");
    const tiltOk = !!(con && con.applied && Math.abs(con.tiltDeg - 20) <= 6);
    record("T21 with correction: gate trips, fitted tilt ≈ 20°, ONE composed affine restores SER==0 on all three annuli",
      okOn && tiltOk,
      detOn + "  conic " + JSON.stringify(con));
  }

  // T21c — the PERSPECTIVE leg, field30's conviction. A fiducial-fit affine
  // absorbs the local linear pose but cannot see the quadratic: a finite-
  // distance tilt leaves each ring's centre shifted by r²·(g,h) — a static
  // k=1 on the same harmonic as the k=1 DATA and the k-ladder's branch
  // guide. field30/31 measured |k1| ≈ 0.05 units, constant per take, with
  // k2 at the leakage floor — middle and outer rings trapped (|static| >
  // |data|), carriers 0.47–0.65. This leg reproduces that exact regime
  // synthetically and asserts the projective correction clears it.
  await tick("T21c: perspective k=1 — rendering + warping…");
  {
    const p21c = OC.profile.defaultProfile({
      render: { size_px: 768, scale_px_per_unit: 124 },
      preamble_symbols: 4
    });
    const seqC = OC.emission.renderSequence(p21c, 152, {});
    // Perspective row sized to the FIELD regime: cg ≈ 0.005 /unit² → in
    // pixels /124 → ring-centre shifts 0.010/0.023/0.041 units against
    // k=1 data amps 0.030/0.020/0.030 — a1/a2 in the trapping zone.
    const gp = 0.005 / 124, phc = 40 * Math.PI / 180;
    const Hp = [1, 0, 0, 0, 1, 0, gp * Math.cos(phc), gp * Math.sin(phc), 1];
    const warpedC = seqC.frames.map((fr, i) => ({ f: i, img: OC.degrade.warpH(fr.img, Hp) }));
    const regCleanC = seqC.frames[0].img;

    await tick("T21c: decoding WITHOUT the correction (must break)…");
    const rOffC = OC.pipeline.decodeSequence(warpedC, p21c, { aligned: true, registerOn: regCleanC, conic: false });
    const detOffC = rOffC.error ? rOffC.error :
      [0, 1, 2].map(L => "L" + L + ":" + fmt(layerResult(rOffC, 0, L))).join("  ");
    // Noiseless, the middle ring survives on its four clean harmonics (only
    // k=1 of five is poisoned) — field noise removes that shelter, which is
    // why the field broke L1 too. The synthetic asserts the ring it honestly
    // breaks: the outer base ring, 1-of-3 harmonics poisoned.
    const A0offC = rOffC.error ? null : layerResult(rOffC, 0, 0);
    const brokeC = !!rOffC.error || !A0offC || !A0offC.present || !!A0offC.error ||
      (typeof A0offC.ser === "number" && A0offC.ser > 0.05);
    record("T21c without correction: r²-growing static k=1 (perspective, field30's magnitude) breaks the outer base ring; enhancement rings shelter on clean harmonics only because the synthetic is noiseless",
      brokeC, detOffC);

    await tick("T21c: decoding WITH the correction…");
    const rOnC = OC.pipeline.decodeSequence(warpedC, p21c, { aligned: true, registerOn: regCleanC });
    const conC = rOnC.error ? null : rOnC.emitters[0].conic;
    let okOnC = !rOnC.error;
    const detOnC = rOnC.error ? rOnC.error : [0, 1, 2].map(L => {
      const A = layerResult(rOnC, 0, L);
      if (!(A.present && A.ser === 0)) okOnC = false;
      return "L" + L + ":" + fmt(A);
    }).join("  ");
    const perspOk = !!(conC && conC.applied && conC.k1p > 0.02 && conC.k1p < 0.08);
    record("T21c with correction: gate trips on dmax, fitted perspective k1 in the field band, projective A restores SER==0 on all three annuli",
      okOnC && perspOk,
      detOnC + "  conic " + JSON.stringify(conC));
  }

  // T21b — the self-gate: on a clean capture the fitted static model sits
  // under the noise floor, A stays the EXACT identity, and the decode is byte-identical
  // to a run with the module disabled — no branch doubling, no thresholds
  // tuned on synthetics (the criterion-hunt lesson made structural).
  await tick("T21b: no tilt — gate stays closed, decode byte-identical…");
  {
    const p21b = OC.profile.defaultProfile({
      render: { size_px: 768, scale_px_per_unit: 124 },
      preamble_symbols: 4
    });
    const seqB = OC.emission.renderSequence(p21b, 72, {});
    const frB = seqB.frames.map((f2, i) => ({ f: i, img: f2.img }));
    const rA = OC.pipeline.decodeSequence(frB, p21b, { aligned: true });
    const rB = OC.pipeline.decodeSequence(frB, p21b, { aligned: true, conic: false });
    const conB = rA.error ? null : rA.emitters[0].conic;
    const identical = !rA.error && !rB.error &&
      JSON.stringify(rA.emitters[0].annuli) === JSON.stringify(rB.emitters[0].annuli);
    const cleanOk = !rA.error && [0, 1, 2].every(L => {
      const A = layerResult(rA, 0, L); return A.present && A.ser === 0;
    });
    record("T21b clean capture: fitted k2 under the self-gating floor, applied:false, annuli byte-identical with the module off",
      !!(conB && conB.applied === false && identical && cleanOk),
      (conB ? "conic " + JSON.stringify(conB) : "no diag") + "  identical:" + identical);
  }

  // ——— T22 family: THE V3 CONTRACT, emitter side (freeze order §10) ———
  // The calibration plate that happens to carry data: edges/bands/plate render,
  // the units-anchor flat circle, beacon luminance-constancy, the QR↔bullseye
  // AE-neutrality swap, and the equalized carriage at the byte level (24-bit
  // droplets, self-framing, M=32 padding). Decoder rungs land with their own
  // T22 cases; nothing here touches the v1/v2 paths.
  await tick("T22: v3 profiles validate…");
  {
    const p3 = OC.profile.profileV3();
    const v3 = OC.profile.validate(p3);
    record("T22 v3 resilient profile validates (trough guards, containment, matched-mean, freeze/loop)",
      v3.ok && v3.errors.length === 0, (v3.errors[0] || "0 errors") + " / " + v3.warnings.length + " warnings");
    if (v3.warnings.length) note("T22 v3 warnings", v3.warnings.join(" | "));
    const p3h = OC.profile.profileV3("high-rate");
    const v3h = OC.profile.validate(p3h);
    record("T22 v3 high-rate profile validates (M-ladder 32/32/16/4, base stays 4)",
      v3h.ok && p3h.annuli[0].rotation.M === 32 && p3h.annuli[3].rotation.M === 4 && p3h.carriage.droplet_bits === 48,
      (v3h.errors[0] || "0 errors") + " M-ladder " + p3h.annuli.map(a => a.rotation.M).join("/"));
    // Frozen §1 geometry spot-checks: sums 0.090, C-pinch exactly 0.23, approach 0.20.
    const sums = p3.annuli.map(a => OC.profile.sumAmp(a));
    const cPinch = 3.00 - (2.68 + sums[3]);
    const approachAB = (1.80 - sums[1]) - (1.42 + sums[0]);
    record("T22 frozen geometry: edge sums 0.090, C-pinch 0.230, A→B approach 0.200 (zero slack)",
      sums.every(s => Math.abs(s - 0.090) < 1e-9) && Math.abs(cPinch - 0.23) < 1e-9 && Math.abs(approachAB - 0.20) < 1e-9,
      "sums " + sums.map(s => s.toFixed(3)).join("/") + " pinch " + cPinch.toFixed(3) + " approach " + approachAB.toFixed(3));
  }

  await tick("T22a: equalized carriage byte round-trip (both presets)…");
  {
    // Pure-fountain loop: carousels → perfect symbol stream → collect at the
    // known framing → assemble. Exercises the 24-bit droplet geometry, the
    // [magic,K] header, block-0 self-framing, and (high-rate) M=32 padding —
    // no optics in the loop, so a failure here is carriage arithmetic.
    const msg = "PHRYCTOROS CARRIES THE STORE";
    for (const preset of ["resilient", "high-rate"]) {
      const p3 = OC.profile.profileV3(preset === "high-rate" ? "high-rate" : undefined);
      const enc = OC.fountain.encodeCarousels(p3, OC.fountain.textToBytes(msg));
      const perRing = p3.annuli.map((a, ai) => {
        const D = OC.fountain.ringD(a, enc.geom);
        const syms = enc.carousels[ai];
        const decoded = [];
        for (let i = 0; i < syms.length; i++) decoded.push({ i, s: syms[i], resid: 0 });
        const col = OC.fountain.collect(decoded, p3.preamble_symbols, a, p3);
        return { seed: a.rotation.seed, droplets: col.passed.map(d => ({ c: d.c, bytes: d.bytes })) };
      });
      const asm = OC.fountain.assemble(perRing, p3);
      const D0 = OC.fountain.ringD(p3.annuli[0], enc.geom);
      const padOk = preset === "high-rate" ? D0 === 10 : D0 === 6; // 48/5 ceils to 10; 24/4 exact
      record("T22a " + preset + ": self-framed payload round-trips (K=" + enc.K + ", D₀=" + D0 + ")",
        asm.ok === true && asm.text === msg && asm.ftype === 0 && padOk,
        JSON.stringify({ ok: asm.ok, K: asm.K, droplets: asm.droplets, text: asm.text.slice(0, 12) + "…" }));
    }
  }

  await tick("T22b: plate render geometry (flat circle = the units anchor)…");
  let v3frame0 = null;
  {
    const p3 = OC.profile.profileV3();
    const img = OC.emission.renderFrame(p3, 0, {});
    v3frame0 = img;
    const scale = p3.render.scale_px_per_unit, half = p3.render.size_px / 2;
    const at = (xu, yu) => img.data[Math.round(yu * scale + half - 0.5) * img.w + Math.round(xu * scale + half - 0.5)];
    // The flat outer circle: walk +x from 2.90 out, find the fill→bg crossing — it
    // must sit at 3.00 within a soft-edge margin, and carry NO angular modulation.
    const crossAt = (theta) => {
      let prev = null, cross = null;
      for (let ru = 2.90; ru <= 3.10; ru += 0.002) {
        const v = at(ru * Math.cos(theta), ru * Math.sin(theta));
        if (prev !== null && prev < 0.47 && v >= 0.47) { cross = ru; break; }
        prev = v;
      }
      return cross;
    };
    const c0 = crossAt(0.3), c1 = crossAt(1.7), c2 = crossAt(3.9);
    const flatOk = [c0, c1, c2].every(c => c !== null && Math.abs(c - 3.00) < 0.02);
    const wobble = Math.max(Math.abs(c0 - c1), Math.abs(c1 - c2));
    record("T22b flat circle: outer boundary at 3.00 ± 0.02 at three angles, wobble < 0.012 (unmodulated gauge; bound = 2 px of lattice aliasing at nearest-pixel sampling)",
      flatOk && wobble < 0.012, "crossings " + [c0, c1, c2].map(c => c && c.toFixed(3)).join("/"));
    // Plate shades: center disc + breaker ring + corner disc at the FILL shade;
    // the bullseye gap and the trough at background.
    const sh = p3.plate.shade, bgv = p3.render.background;
    const probes = [
      { v: at(0, 0), want: sh, name: "center disc" },
      { v: at(0.30, 0), want: bgv, name: "bullseye gap 0.30" },
      { v: at(0.75, 0), want: sh, name: "breaker ring 0.75" },
      { v: at(2.65, 2.65), want: sh, name: "corner disc" },
      { v: at(2.65 + 0.40 * 0.5, 2.65), want: bgv, name: "corner gap" },
      { v: at(1.66, 0), want: bgv, name: "trough A→B" },
      { v: at(2.51, 0.2), want: bgv, name: "trough B→C" }
    ];
    const bad = probes.filter(pr => Math.abs(pr.v - pr.want) > 0.03);
    record("T22b plate shades: bullseyes/breaker at fill shade, gaps and troughs at background",
      bad.length === 0, bad.length ? bad.map(b => b.name + "=" + b.v.toFixed(3)).join(" ") : "7 probes within 0.03");
  }

  await tick("T22c: beacon — luminance-constant, boundary-moving…");
  {
    const p3 = OC.profile.profileV3();
    const n = 12;
    const seq = OC.emission.renderSequence(p3, n, {});
    const scale = p3.render.scale_px_per_unit, half = p3.render.size_px / 2;
    // Shell mean over the beacon's reach each frame — AE sees a constant ring.
    const shell = [];
    for (const fr of seq.frames) {
      let sum = 0, cnt = 0;
      const img = fr.img;
      for (let py = 0; py < img.h; py += 2) {
        const yu = (py + 0.5 - half) / scale;
        if (Math.abs(yu) > 0.87) continue;
        for (let px = 0; px < img.w; px += 2) {
          const xu = (px + 0.5 - half) / scale;
          const r = Math.hypot(xu, yu);
          if (r < 0.64 || r > 0.87) continue;
          sum += img.data[py * img.w + px]; cnt++;
        }
      }
      shell.push(sum / cnt);
    }
    const spread = Math.max(...shell) - Math.min(...shell);
    // The boundary must MOVE: at a fixed point straddling the nominal inner edge,
    // the wiggle modulates coverage frame to frame.
    const probePx = { x: Math.round(0.70 * scale + half), y: half };
    const probeVals = seq.frames.map(fr => fr.img.data[probePx.y * fr.img.w + probePx.x]);
    const probeSpread = Math.max(...probeVals) - Math.min(...probeVals);
    record("T22c beacon: shell mean constant (< 0.004) while the edge point swings (> 0.05) — wiggle, not blink (a blinking ring would swing the shell ~0.1)",
      spread < 0.004 && probeSpread > 0.05,
      "shell spread " + spread.toFixed(5) + " edge swing " + probeSpread.toFixed(3));
  }

  await tick("T22d: QR↔bullseye swap AE neutrality…");
  {
    const p3 = OC.profile.profileV3();
    const steady = v3frame0 || OC.emission.renderFrame(p3, 0, {});
    const cdImg = OC.emission.renderFrameV3(p3, 0, { countdown: true });
    const scale = p3.render.scale_px_per_unit, half = p3.render.size_px / 2;
    const centerMean = (img) => {
      let sum = 0, cnt = 0;
      for (let py = 0; py < img.h; py++) {
        const yu = (py + 0.5 - half) / scale;
        if (Math.abs(yu) > p3.plate.quiet_r) continue;
        for (let px = 0; px < img.w; px++) {
          const xu = (px + 0.5 - half) / scale;
          if (xu * xu + yu * yu > p3.plate.quiet_r * p3.plate.quiet_r) continue;
          sum += img.data[py * img.w + px]; cnt++;
        }
      }
      return sum / cnt;
    };
    const ms = centerMean(steady), mc = centerMean(cdImg);
    const mm = OC.emission.centerMeans(p3);
    record("T22d matched-mean on rendered pixels: |countdown − steady| ≤ 0.05, analytic within 0.02 of rendered",
      Math.abs(ms - mc) <= 0.05 && Math.abs(mm.steady - ms) < 0.02 && Math.abs(mm.countdown - mc) < 0.02,
      "steady " + ms.toFixed(3) + "/" + mm.steady.toFixed(3) + " countdown " + mc.toFixed(3) + "/" + mm.countdown.toFixed(3));
  }

  await tick("T22e: recurring-countdown timeline + envelope integrity…");
  {
    const p3 = OC.profile.profileV3();
    const tl = (f) => OC.emission.timeline(p3, f);
    const cases = [
      [0, true, 0], [89, true, 0], [90, false, 0], [1799, false, 1709],
      [1800, true, 1710], [1889, true, 1710], [1890, false, 1710], [3600, true, 3420]
    ];
    const bad = cases.filter(([f, fr, eff]) => { const t = tl(f); return t.freeze !== fr || t.eff !== eff; });
    record("T22e timeline: freeze 3 s recurs each 60 s loop, schedule pauses (eff resumes where it froze)",
      bad.length === 0, bad.length ? "bad at f=" + bad.map(b => b[0]).join(",") : cases.length + " checkpoints exact");
    const env = OC.emission.envelopeBytes(p3, { K: 65, len: 129, pcrc: 0xBEEF, capability: 1 });
    const crcOk = ((env[18] << 8) | env[19]) === OC.fountain.crc16(env.subarray(0, 18));
    const m1 = OC.emission.envelopeModules(p3.qr, env);
    const m2 = OC.emission.envelopeModules(p3.qr, env);
    let same = true, dark = 0;
    for (let i = 0; i < m1.length; i++) { if (m1[i] !== m2[i]) { same = false; break; } dark += m1[i]; }
    const density = dark / m1.length;
    record("T22e envelope: CRC16 seals bytes 0–17; module map deterministic, whitened density 0.35–0.65",
      crcOk && same && density > 0.35 && density < 0.65,
      "crc " + crcOk + " density " + density.toFixed(3));
  }

  let v3seq = null, v3res = null, v3msg = null; // shared with the rung-2 tests below
  await tick("T22f: v3 optical round-trip (rings register the plate, 4 edges decode, pooled peel)…");
  {
    // The full loop through the OPTICS: analytic v3 frames → finder scan finds
    // nothing (bullseyes are anti-QR by design) → ring registration on the
    // band silhouette with the FLAT CIRCLE as the scale gauge → flipped-mode
    // sampling on the inner-facing edges → four CRC-aligned carousels → one
    // pooled peel through block-0 self-framing. Decoder rung 1 (static conic,
    // v2-shipped) carries it; bullseye/per-frame-solve rungs land next.
    const p3 = OC.profile.profileV3();
    // Payload sized to the capture: 320 frames reach carousel slot ~11 per fast
    // edge, and K=12 peels deterministically from those slots (verified against
    // the seeded subsets). The 28-char canonical string needs 480 frames — the
    // fountain arithmetic is T22a's job; this test buys the OPTICS.
    v3msg = "V3 CARRIES THE STORE";
    const msg = v3msg;
    const enc3 = OC.fountain.encodeCarousels(p3, OC.fountain.textToBytes(msg));
    v3seq = OC.emission.renderSequence(p3, 320, { carousels: enc3.carousels });
    const seq3 = v3seq;
    v3res = OC.pipeline.decodeSequence(seq3.frames, p3, { payload: true });
    const res3 = v3res;
    const em3 = res3.error ? null : res3.emitters[0];
    const pay3 = em3 && em3.payload;
    const locks = em3 ? em3.annuli.map(a => a.error ? "ERR" : (a.alignMethod || "?") + "@" + a.alignLag) : [];
    record("T22f v3 optical round-trip: ring registration (method rings), all four edges CRC-lock, payload peels through self-framing",
      !!(em3 && em3.method === "rings" && pay3 && pay3.ok === true && pay3.text === msg &&
         em3.annuli.every(a => !a.error && a.dropletsPassed > 0)),
      em3 ? "method " + em3.method + " locks " + locks.join(" ") +
            " droplets " + em3.annuli.map(a => a.dropletsPassed).join("/") +
            " → " + JSON.stringify(pay3 && { ok: pay3.ok, K: pay3.K, text: (pay3.text || "").slice(0, 14) + "…" })
          : "no emitter: " + JSON.stringify(res3).slice(0, 160));
  }

  // ——— T22 rung 2: the plate as a per-frame instrument, the beacon as a channel ———
  await tick("T22g: bullseye detector + plate solve recover a perturbed H…");
  {
    const p3 = OC.profile.profileV3();
    const img = v3frame0 || OC.emission.renderFrame(p3, 0, {});
    const scale = p3.render.scale_px_per_unit, half = p3.render.size_px / 2;
    // Truth: unit (0,0) sits at px 511.5. Perturb scale ×1.02 and shift +3 px —
    // the detector must find all five bullseyes and the DLT must pull center
    // and scale back to truth.
    const Hbad = [scale * 1.02, 0, half - 0.5 + 3, 0, scale * 1.02, half - 0.5 + 3, 0, 0, 1];
    const sol = OC.plate.plateSolve(img, Hbad, p3);
    const c = sol && OC.geom.applyH(sol.H, 0, 0);
    const u = sol && OC.sample.unitScale(sol.H);
    record("T22g plate solve: 5/5 bullseyes verified (center breaker present), residual < 0.5 px, center within 0.8 px and scale within 0.5% of truth",
      !!(sol && sol.used === 5 && sol.residPx < 0.5 && sol.points[0] && sol.points[0].breaker === true &&
         Math.abs(c[0] - 511.5) < 0.8 && Math.abs(c[1] - 511.5) < 0.8 && Math.abs(u / scale - 1) < 0.005),
      sol ? "used " + sol.used + " resid " + sol.residPx.toFixed(3) + "px center (" + c[0].toFixed(2) + "," + c[1].toFixed(2) + ") scale " + (u / scale).toFixed(4) + "× breaker " + sol.points[0].breaker
          : "no solve");
  }

  await tick("T22h: per-frame plate solve vs static conic — byte parity on cleans…");
  {
    const p3 = OC.profile.profileV3();
    const resS = OC.pipeline.decodeSequence(v3seq.frames, p3, { payload: true, plateSolve: true });
    const emS = resS.error ? null : resS.emitters[0];
    const payS = emS && emS.payload;
    const dropsA = v3res.emitters[0].annuli.map(a => a.dropletsPassed).join("/");
    const dropsB = emS ? emS.annuli.map(a => a.dropletsPassed).join("/") : "-";
    record("T22h per-frame solve: every frame solves (5-point DLT), sub-pixel residual, and the decode is BYTE-PAR with the static path (same droplets, same payload)",
      !!(emS && emS.plateSolve && emS.plateSolve.solved === emS.plateSolve.frames && emS.plateSolve.meanResidPx < 0.5 &&
         payS && payS.ok === true && payS.text === v3msg && dropsB === dropsA),
      emS ? "solved " + emS.plateSolve.solved + "/" + emS.plateSolve.frames + " resid " + emS.plateSolve.meanResidPx +
            "px droplets " + dropsB + " (static " + dropsA + ") → " + JSON.stringify(payS && { ok: payS.ok, text: (payS.text || "").slice(0, 10) + "…" })
          : "no emitter");
    v3seq = null; v3res = null; // ~1.3 GB of frames — release before the T23 renders (the batch-diag heap lesson)
  }

  await tick("T22i: beacon round-trip — the control channel through the standard chain…");
  {
    const p3 = OC.profile.profileV3();
    // Short synthetic envelope: the demod is framing-agnostic (magic+len+CRC8),
    // so a 4-byte payload proves the loop in 280 frames instead of 770.
    const envShort = new Uint8Array([0xE5, 0x01, 0x02, 0x03]);
    let seqB = OC.emission.renderSequence(p3, 280, { envBytes: envShort });
    const resB = OC.pipeline.decodeSequence(seqB.frames, p3, { beacon: true });
    seqB = null; // ~1.1 GB — release before the T23 renders (the heap-edge lesson)
    const emB = resB.error ? null : resB.emitters[0];
    const rowB = emB && emB.annuli.find(a => a.beacon);
    const hex = rowB && rowB.envelope;
    record("T22i beacon: rides the ring pair's outer edge as a fifth channel, preamble-locks, and the framed envelope decodes byte-exact",
      !!(rowB && !rowB.error && hex === "e5010203" && Math.abs((rowB.carrierRatio || 0) - 1) < 0.4),
      rowB ? "lock " + rowB.alignMethod + "@" + rowB.alignLag + " carrier " + rowB.carrierRatio + "× envelope " + hex + " at byte " + rowB.envelopeAt
           : "no beacon row: " + JSON.stringify(resB).slice(0, 120));
  }

  await tick("T22j: preset auto-detect — dual-geometry CRC vote on a high-rate emission…");
  {
    const pH = OC.profile.profileV3("high-rate");
    const encH = OC.fountain.encodeCarousels(pH, OC.fountain.textToBytes("V3 CARRIES THE STORE"));
    const seqH = OC.emission.renderSequence(pH, 160, { carousels: encH.carousels });
    const auto = OC.pipeline.decodeV3Auto(seqH.frames, {});
    record("T22j auto-detect: resilient decode of a high-rate emission scores ~0 CRC passes, the high-rate pass clears the ≥2 bar, verdict = high-rate",
      auto.preset === "high-rate" && auto.passes >= 2,
      "preset " + auto.preset + " passes " + auto.passes);
  }

  // ——— T23: tiling (§7) — the density knob, tile identity, the cross-tile pool ———
  await tick("T23a: 6-up render geometry (designated tile, gutter vertices, per-tile gauge)…");
  {
    // Reduced scale: geometry probes need no decode headroom.
    const p6 = OC.profile.profileV3(undefined, { tiling: 6, render: { scale_px_per_unit: 60 } });
    const v6 = OC.profile.validate(p6);
    const img = OC.emission.renderFrame(p6, 0, {});
    const sc = 60, pitch = 7.2;
    const at = (xu, yu) => img.data[Math.round(yu * sc - 0.5) * img.w + Math.round(xu * sc - 0.5)];
    const c0x = 0.5 * pitch, c1x = 1.5 * pitch, cy = 0.5 * pitch;
    const c5x = 2.5 * pitch, c5y = 1.5 * pitch;
    const probes = [
      { v: at(c0x + 0.75, cy), want: p6.plate.shade, name: "tile0 breaker" },
      { v: at(c1x + 0.75, cy), want: p6.render.background, name: "tile1 no-breaker" },
      { v: at(c1x, cy), want: p6.plate.shade, name: "tile1 center disc" },
      { v: at(pitch, pitch), want: p6.plate.shade, name: "gutter vertex disc" },
      { v: at(pitch, 0.5 * pitch), want: p6.render.background, name: "gutter midline" }
    ];
    const bad = probes.filter(pr => Math.abs(pr.v - pr.want) > 0.03);
    // per-tile flat gauge on the far tile (5): local +x crossing at 3.00
    let cross = null, prev = null;
    for (let ru = 2.90; ru <= 3.10; ru += 0.004) {
      const v = at(c5x + ru, c5y);
      if (prev !== null && prev < 0.47 && v >= 0.47) { cross = ru; break; }
      prev = v;
    }
    record("T23a 6-up: validates, canvas 3×2·pitch, breaker on tile 0 ONLY, gutter-vertex bullseye present, tile-5 flat gauge at 3.00",
      v6.ok && img.w === Math.round(3 * pitch * sc) && img.h === Math.round(2 * pitch * sc) &&
      bad.length === 0 && cross !== null && Math.abs(cross - 3.00) < 0.04,
      (v6.ok ? "" : v6.errors[0] + " | ") + img.w + "×" + img.h +
      (bad.length ? " bad: " + bad.map(b => b.name + "=" + b.v.toFixed(3)).join(" ") : " 5 probes ok") +
      " gauge " + (cross && cross.toFixed(3)));
  }

  await tick("T23b: 6-up registration — six tiles, one designated…");
  {
    const p6 = OC.profile.profileV3(undefined, { tiling: 6, render: { scale_px_per_unit: 60 } });
    const img = OC.emission.renderFrame(p6, 0, {});
    const reg = OC.register.registerAll(img, { profile: p6, maxEmitters: 6 });
    let breakers = 0;
    for (const em of reg.emitters) {
      const b = OC.plate.findBullseye(img, em.H, 0, 0, p6.plate.center.r_out, { breaker: p6.plate.breaker });
      if (b && b.breaker) breakers++;
    }
    record("T23b 6-up registration: ring path finds 6 tiles, exactly one carries the breaker (the count asymmetry = tile identity)",
      reg.emitters.length === 6 && breakers === 1,
      reg.emitters.length + " emitters (method " + (reg.method || "finder") + "), " + breakers + " breaker(s)");
  }

  await tick("T23c: 2-up pooled optical decode — one peel over two tile-seeded carousels…");
  {
    const p2 = OC.profile.profileV3(undefined, { tiling: 2, render: { scale_px_per_unit: 100 } });
    const msg2 = "V3!";
    const seq2 = OC.emission.renderSequence(p2, 200, { payloadBytes: OC.fountain.textToBytes(msg2) });
    const res2 = OC.pipeline.decodeSequence(seq2.frames, p2, { payload: true, maxEmitters: 6 });
    const ems = res2.error ? [] : res2.emitters;
    const tiles = ems.map(e => e.tile).sort().join(",");
    const perDrops = ems.map(e => e.payload ? e.payload.droplets : 0);
    const pooled = res2.pooled;
    record("T23c 2-up: both tiles register and identify (0,1), the cross-tile pool peels the payload with more droplets than either tile alone",
      ems.length === 2 && tiles === "0,1" && res2.designatedTile !== undefined &&
      !!(pooled && pooled.ok === true && pooled.text === msg2 && pooled.droplets > Math.max.apply(null, perDrops)),
      ems.length + " tiles [" + tiles + "] designated " + res2.designatedTile +
      " per-tile droplets " + perDrops.join("/") +
      " pooled " + JSON.stringify(pooled && { ok: pooled.ok, droplets: pooled.droplets, text: pooled.text }));
  }
}

main().then(() => suiteFinish(window.SUITE_PAGE)).catch(e => suiteError(window.SUITE_PAGE, e));
</script>
