<script>
"use strict";
const OC = window.OC;
const $ = id => document.getElementById(id);
// The profile is the CONTRACT: the selector picks which mapping decodes.
// v1 and the v2 rate variants (v20/v30) were pruned 2026-08-21 — every extra
// selectable standard is mode-mismatch surface, and mismatch has cost more
// field trials here than optics has. Clips filmed under them need the builders
// revived from git; that was the accepted price of the ruling.
function currentProfile() {
  const v = $("m_prof") ? $("m_prof").value : "v2";
  // v3 = the inverted ladder as of 2026-08-21 (base innermost); PACED is the
  // v3.1 standard as of 2026-08-23, so v3/v3hr are paced and the trial names
  // v3p/v3hrp resolve to the same profiles. v3f/v3hrf decode pre-ruling flat
  // clips; v3c decodes pre-flip captures; v3i is the old inverted alias.
  if (v === "v3" || v === "v3a" || v === "v3i" || v === "v3p") return v31Opts(OC.profile.profileV3());
  if (v === "v3hr" || v === "v3hrp") return v31Opts(OC.profile.profileV3("high-rate"));
  if (v === "v3f") return v31Opts(OC.profile.profileV3("flat"));
  if (v === "v3hrf") return v31Opts(OC.profile.profileV3("high-rate-flat"));
  if (v === "v3c") return v31Opts(OC.profile.profileV3("classic"));
  return OC.profile.defaultProfile();
}
// v3.1 amendment-2 toggle: quadrant corners → saddle-first registration +
// saddle track-solve (for clips filmed with the quadrant emitter). The
// persistent-QR toggle decodes the diagnostic-variant clips (finder-first).
function v31Opts(p) {
  if ($("m_quad") && $("m_quad").checked) p.plate.corner_style = "quadrant";
  if ($("m_qrp") && $("m_qrp").checked) p.qr_persistent = true;
  // TILING — the first 2-up field night's biggest find: the settings intake
  // read tiling=2, the summary SAID "2-up emitter", and the profile stayed
  // tiling:1 — so the pre-scan crop hugged one plate, plate 2 was cropped
  // out of the capture entirely, and the receiver could never see two
  // emitters no matter what registration did. The declared lattice must
  // reach the profile, not the summary text.
  if (window.ocTiling > 1) p.tiling = window.ocTiling;
  // D-ring ruling-2 trial: the FRAMING is auto-detected, but the beacon's
  // M/F must match the emitter for demodulation — the settings string's
  // dring= key sets this select.
  OC.profile.applyDring(p, $("m_dring") ? $("m_dring").value : "f24");
  return p;
}
function payloadMode() { const v = $("m_prof") && $("m_prof").value; return v === "v2p" || v3Mode(); }
function v3Mode() { const v = $("m_prof") && $("m_prof").value; return v === "v3" || v === "v3hr" || v === "v3a" || v === "v3i" || v === "v3c" || v === "v3p" || v === "v3hrp" || v === "v3f" || v === "v3hrf"; }
if ($("m_prof")) $("m_prof").onchange = () => { $("v3opts").style.display = v3Mode() ? "" : "none"; };
// The file path SEEKS at the capture cadence — a 60 fps clip stepped at 1/30
// silently drops every other camera frame and starves the duplicate defense.
function captureFps() { return +($("m_capfps") && $("m_capfps").value) || 30; }
const rows = [];
let stream = null, capturing = false, camFrames = [], frameCounter = 0;

$("caps").textContent =
  "capabilities: secureContext=" + window.isSecureContext +
  " · getUserMedia=" + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) +
  " · origin=" + location.protocol + " — file-input decode needs NO camera and NO secure context (§9.1); " +
  "this page is the sneakernet artifact: it must keep working from file://.";

function setStatus(t, cls) { $("status").textContent = t; $("status").className = cls || ""; }

/* ---------- the decode worker: heavy stages off the UI thread ----------
   Frames transfer as ArrayBuffers (zero-copy; they are never reused after a
   decode — previews draw at grab time). Fallback runs in-thread with the old
   setTimeout yield, so the file:// standalone behaves exactly as before. */
let dworker = null, dworkerId = 0;
const dworkerCbs = {};
function getWorker() {
  if (dworker === false) return null;
  if (dworker) return dworker;
  try {
    dworker = new Worker("worker.js");
    dworker.onmessage = e => {
      const cb = dworkerCbs[e.data.id];
      delete dworkerCbs[e.data.id];
      if (cb) cb(e.data);
    };
    dworker.onerror = () => {
      for (const id in dworkerCbs) { dworkerCbs[id]({ error: "decode worker failed — re-run (in-thread fallback engaged)" }); delete dworkerCbs[id]; }
      try { dworker.terminate(); } catch (_) {}
      dworker = false;
    };
    return dworker;
  } catch (e) { dworker = false; return null; }
}
function decodeAsync(frames, profile, opts, auto) {
  const w = getWorker();
  if (!w) return new Promise(rp => setTimeout(() => {
    try { rp(auto ? OC.pipeline.decodeV3Auto(frames, opts) : OC.pipeline.decodeSequence(frames, profile, opts)); }
    catch (e) { rp({ error: e.message }); }
  }, 30));
  return new Promise(rp => {
    const id = ++dworkerId;
    dworkerCbs[id] = m => rp(m.error ? { error: m.error } : m.result);
    const payload = frames.map(fr => ({
      f: fr.f, w: fr.img.w, h: fr.img.h, norm: fr.img.norm,
      u8: fr.img.data instanceof Uint8Array, buf: fr.img.data.buffer
    }));
    w.postMessage({ id, auto: !!auto, frames: payload, profile, opts }, payload.map(p => p.buf));
  });
}

function toLumFromCanvas(ctx, w, h) {
  const id = ctx.getImageData(0, 0, w, h).data;
  const out = new Uint8Array(w * h);
  for (let i = 0, j = 0; i < out.length; i++, j += 4)
    out[i] = (id[j] * 77 + id[j + 1] * 150 + id[j + 2] * 29) >> 8;
  return { w, h, data: out, norm: 255 };
}

function layerSummary(res) {
  if (res.error) return "<span class='bad'>" + res.error + "</span>";
  let html = "";
  if (res.pooled) {
    html += res.pooled.ok
      ? "<p class='ok' style='font-size:15px'><b>POOLED ACROSS TILES</b> (" + res.pooled.recovered + "/" + res.pooled.K + " blocks, " + res.pooled.droplets + " droplets): “" + res.pooled.text + "”</p>"
      : "<p class='warn'><b>tile pool incomplete</b> — " + (res.pooled.reason || "collecting") + " (" + (res.pooled.recovered || 0) + "/" + (res.pooled.K || "?") + " blocks, " + (res.pooled.droplets || 0) + " droplets)</p>";
  }
  res.emitters.forEach((em, ei) => {
    if (em.payload) {
      const p = em.payload;
      html += p.ok
        ? "<p class='ok' style='font-size:15px'><b>PAYLOAD RECOVERED</b> (" + p.recovered + "/" + p.K + " blocks, " + p.droplets + " droplets): “" + p.text + "”</p>"
        : "<p class='warn'><b>payload incomplete</b> — " + (p.reason || "collecting") +
          (p.K ? " (" + (p.recovered || 0) + "/" + p.K + " blocks, " + (p.droplets || 0) + " droplets — film longer or closer)" : " (" + (p.got || 0) + " droplets so far)") + "</p>";
    }
    html += "<table><tr><th colspan='10'>emitter " + ei + " — fiducial " + em.fiducialWidthPx + "px" + (em.method === "rings" ? " (ring-registered)" : "") +
      (em.tile !== undefined ? " · tile " + (em.tile < 0 ? "?" : em.tile) + (res.designatedTile === ei ? " (designated)" : "") : "") +
      (em.plateSolve ? " · solved " + em.plateSolve.solved + "/" + em.plateSolve.frames + (em.plateSolve.meanResidPx != null ? " @" + em.plateSolve.meanResidPx + "px" : "") : "") +
      "</th></tr>" +
      "<tr><th>annulus</th><th>layer</th><th>present</th><th>carrier</th><th>SER</th><th>erasures</th><th>lock</th><th>contrast</th><th>SNR/harmonic (dB)</th><th>verdict</th></tr>";
    em.annuli.forEach(a => {
      const snr = a.snr_db ? Object.entries(a.snr_db).map(([k, v]) => "k" + k + ":" + v).join(" ") : "—";
      const lock = a.alignMethod ? (a.alignMethod + (a.framing === "chunked" ? " chunked" : "") + (a.folded ? " folded" : "") + " lag " + a.alignLag + (a.alignMatchFrac ? " (" + a.alignMatchFrac + ")" : "") +
                                    (a.folded ? " (repeats agree " + Math.round((a.foldAgree || 0) * 100) + "%/" + a.foldCompared + ")" : "") +
                                    (a.framing === "chunked" && a.tag ? " tag " + a.tag + (a.tagSightings ? " ×" + a.tagSightings : "") : "")) : "—";
      const verdict = !a.present ? "<span class='dim'>unresolved</span>" :
        a.beacon && a.envelope ? "<span class='ok'>ENVELOPE " + a.envelope +
          (a.envelopeFields ? " — " + a.envelopeFields.preset + " session " + a.envelopeFields.session32.toString(16).padStart(8, "0") +
            " K=" + a.envelopeFields.K + " tiling=" + a.envelopeFields.tiling +
            (a.envelopeFields.tiling > 1 ? " (grid " + a.envelopeFields.grid.cols + "×" + a.envelopeFields.grid.rows + ", tile " + a.envelopeFields.tile + ")" : "") +
            " loop=" + a.envelopeFields.loop_s + "s" : "") +
          (a.envelopeFrames > 1 ? " ×" + a.envelopeFrames : "") + "</span>" :
        a.error ? "<span class='bad'>" + a.error + "</span>" :
        a.dropletsPassed != null ? "<span class='" + (a.dropletsPassed > 0 ? "ok" : "warn") + "'>" + a.dropletsPassed + "/" + a.dropletsTried + " droplets</span>" :
        a.ok ? "<span class='ok'>DECODES</span>" : "<span class='warn'>degraded</span>";
      html += "<tr><td>" + a.annulus + "</td><td>" + a.layer + "</td><td>" + (a.present ? "yes" : "no") +
        "</td><td>" + (a.carrierRatio ?? "—") + "×</td><td>" + (a.ser ?? "—") + "</td><td>" + (a.erasures ?? "—") + "</td><td>" + lock +
        "</td><td>" + (a.contrast ?? "—") + "</td><td>" + snr + "</td><td>" + verdict + "</td></tr>";
    });
    html += "</table>";
  });
  return html;
}

function logRow(res, source, fpsMeasured, nFrames) {
  const em = res.emitters && res.emitters[0];
  const row = {
    ts: new Date().toISOString(),
    range_m: $("m_range").value || "", lighting: $("m_light").value,
    tx_type: $("m_tx").value, tx_size_m: $("m_txsize").value,
    rx_device: $("m_rx").value || "", camera: $("m_cam").value,
    handheld: $("m_hand").checked, source, fps_measured: fpsMeasured, frames: nFrames,
    notes: $("m_notes").value || ""
  };
  for (let a = 0; a < 3; a++) {
    const A = em && em.annuli[a] || {};
    row["a" + a + "_present"] = A.present ?? false;
    row["a" + a + "_ser"] = A.ser ?? "";
    row["a" + a + "_erasure_rate"] = A.erasureRate ?? "";
    row["a" + a + "_ok"] = A.ok ?? false;
    row["a" + a + "_contrast"] = A.contrast ?? "";
    row["a" + a + "_snr"] = A.snr_db ? Object.entries(A.snr_db).map(([k, v]) => k + ":" + v).join("|") : "";
  }
  rows.push(row);
  $("rowsN").textContent = rows.length + " rows";
  drawPlot();
}

function decodeFrames(frames, source, fpsMeasured) {
  const isV3 = v3Mode(), isAuto = $("m_prof").value === "v3a";
  const opts = {
    aligned: false, handheld: $("m_hand").checked,
    loopSeconds: +$("m_loop").value || 60,
    mirror: { receive: false }, maxEmitters: isV3 ? 6 : 4,
    payload: payloadMode(),
    plateSolve: isV3 && $("m_solve").checked,
    beacon: isV3 && $("m_beacon").checked
  };
  setStatus("decoding " + frames.length + " frames (" + currentProfile().profile_version + ")" +
    (getWorker() ? " — off-thread, UI stays live…" : "…"), "warn");
  decodeAsync(frames, currentProfile(), opts, isAuto).then(out => {
    let res = out, preset = null;
    if (isAuto && out && out.result !== undefined) {
      res = out.result;
      preset = out.preset;
      setStatus("auto-detect: preset " + (preset || "UNDETERMINED") + " (" + out.passes + " CRC passes)", preset ? "ok" : "warn");
    }
    $("results").innerHTML = (isAuto ? "<p class='" + (preset ? "ok" : "warn") + "'>auto-detect verdict: <b>" + (preset || "undetermined") + "</b></p>" : "") + layerSummary(res);
    logRow(res, source, fpsMeasured, frames.length);
    if (!isAuto) setStatus(res.error ? "decode failed: " + res.error : "decode complete", res.error ? "bad" : "ok");
  });
}

/* ---------- self-test: render → decode entirely in-page ---------- */
$("selftestBtn").onclick = () => {
  setStatus("self-test: rendering 64 synthetic frames…", "warn");
  setTimeout(() => {
    const p = OC.profile.defaultProfile({ render: { size_px: 512, scale_px_per_unit: 82 }, preamble_symbols: 4 });
    const seq = OC.emission.renderSequence(p, 64, {});
    // Routed through decodeAsync deliberately: the self-test now also proves
    // the worker path (or the fallback) on this install.
    decodeAsync(seq.frames, p, { aligned: true }).then(res => {
      $("results").innerHTML = layerSummary(res);
      const a0 = !res.error && res.emitters && res.emitters[0].annuli[0];
      const via = getWorker() ? " (via decode worker)" : " (in-thread fallback)";
      setStatus(a0 && a0.ser === 0 ? "self-test PASS — install works; decoder closes the loop" + via : "self-test FAIL" + via, a0 && a0.ser === 0 ? "ok" : "bad");
    });
  }, 30);
};

/* ---------- live camera (C1: needs secure context) ---------- */
$("camBtn").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: $("m_cam").value === "front" ? "user" : "environment", width: { ideal: 1280 }, frameRate: { ideal: 30 } }
    });
    const v = $("vid"); v.srcObject = stream; v.style.display = ""; await v.play();
    $("capBtn").disabled = false;
    setStatus("camera live — frame the emitter, prop the phone (or tick handheld), then Capture", "ok");
  } catch (e) { setStatus("camera failed: " + e.message + " (C1: HTTPS or localhost only — use the file path instead)", "bad"); }
};

$("capBtn").onclick = () => {
  const v = $("vid");
  const secs = Math.max(3, +$("capSecs").value || 8);
  const W = 800, H = Math.round(800 * v.videoHeight / v.videoWidth) || 450;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  camFrames = []; capturing = true;
  const fps = currentProfile().frame_rate_hz;
  const perIdx = {};
  const tEnd = performance.now() + secs * 1000;
  const t0Wall = performance.now();
  const times = [];
  setStatus("capturing " + secs + " s…", "warn");
  // Duplicates are DELIBERATE: the camera runs faster than the 15 fps emission,
  // so each emission frame gets ≥2 looks and the decoder keeps the tear-free one.
  function grab(now, meta) {
    if (!capturing) return;
    if (now >= tEnd) {
      capturing = false;
      const fpsMeas = times.length > 1 ? (1000 * (times.length - 1) / (times[times.length - 1] - times[0])).toFixed(1) : "?";
      decodeFrames(camFrames, "camera-live", fpsMeas);
      return;
    }
    const t = meta ? meta.mediaTime : (now - t0Wall) / 1000;
    const idx = Math.round(t * fps);
    if ((perIdx[idx] || 0) < 3) {
      ctx.drawImage(v, 0, 0, W, H);
      camFrames.push({ f: idx, img: toLumFromCanvas(ctx, W, H) });
      perIdx[idx] = (perIdx[idx] || 0) + 1;
    }
    times.push(now);
    if ("requestVideoFrameCallback" in v) v.requestVideoFrameCallback(grab);
    else requestAnimationFrame(grab);
  }
  if ("requestVideoFrameCallback" in v) v.requestVideoFrameCallback(grab);
  else requestAnimationFrame(grab);
};

/* ---------- the harvest STORE (cross-clip: it outlives the clip) ----------
   v2, the lease build: CONTENT-addressed ledgers (droplets are session-
   independent, so same content pools across sessions, restarts and clips)
   under TAG-addressed contexts (the lease — bind/coast/grace/clip). The
   operator's declared profile is the top degrade rung; provisionals are
   clip-scoped and never exported. */
let store = null;
function ensureStore() {
  if (!store) store = OC.harvest.createStore(currentProfile());
  return store;
}
function ledgerInfo() {
  if (!store) { $("ledInfo").textContent = "store: empty"; return; }
  const cn = OC.harvest.storeCounts(store);
  const ctxBits = Object.keys(store.contexts).map(t => {
    const c = store.contexts[t];
    return t + ":" + c.state + (c.session32 ? "/" + (c.session32 >>> 0).toString(16) : "");
  });
  $("ledInfo").textContent = "store: " + cn.droplets + " droplets / " + cn.ledgers + " content ledger" +
    (cn.ledgers === 1 ? "" : "s") + " / " + cn.contexts + " context" + (cn.contexts === 1 ? "" : "s") +
    (ctxBits.length ? " [" + ctxBits.join(" · ") + "]" : "");
}
$("ledSaveBtn").onclick = () => {
  if (!store) { setStatus("nothing to export — the store is empty", "warn"); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([OC.harvest.serializeStore(store)], { type: "application/json" }));
  a.download = "phryctoros-store-" + Date.now() + ".json";
  a.click();
};
$("ledClearBtn").onclick = () => { store = null; ledgerInfo(); $("harvest").innerHTML = ""; };
$("ledIn").onchange = async () => {
  const f = $("ledIn").files[0];
  if (!f) return;
  try {
    store = OC.harvest.parseStore(await f.text());
    ledgerInfo();
    setStatus("store loaded — the next harvest mines only what it lacks", "ok");
  } catch (e) { setStatus("store load failed: " + e.message, "bad"); }
};

/* Seek-capture one time-window [tA, tB) of the loaded clip at the capture
   cadence, cropped at native resolution. Frames carry LOCAL emission indices
   (0-based at the window's first emission frame) — the pipeline sees each
   window exactly like a capture that started there; the caller keeps fBase to
   place results on the clip's absolute axis. Returns the seek count: the
   harvest receipt's currency. */
async function seekWindow(v, geo, tA, tB, capFps, emitFps, onStep) {
  const seek = t => new Promise(r => { v.onseeked = () => r(); v.currentTime = t; });
  const fBase = Math.round(tA * emitFps);
  const frames = []; const perIdx = {}; let seeks = 0;
  const tEnd = Math.min(tB, v.duration - 0.05);
  // Seek to the MIDDLE of each capture frame's interval, never its boundary:
  // container timestamps are microsecond-rounded (frame 2 of a 30 fps file
  // sits at 66667 µs while 2/30 s is a hair EARLIER), so boundary seeks hand
  // back the previous frame for one third of all frames — a symbol stream
  // one-third replaced by its predecessor: skewed carriers, zero locks,
  // healthy contrast. Two-looks-per-frame phone captures mostly hid it
  // (duplicate selection discards the bad look); a native-rate file has no
  // rescue — the export loopback caught it. Mid-frame + floor keeps the
  // 60→30 pairing exact: floor((i+0.5)/2) = (0,1),(2,3),…
  for (let i = Math.ceil(tA * capFps); ; i++) {
    const t = (i + 0.5) / capFps;
    if (t >= tEnd) break;
    await seek(t); seeks++;
    const idx = Math.floor(t * emitFps) - fBase;
    if ((perIdx[idx] || 0) < 2) {
      geo.ctx.drawImage(v, geo.sx, geo.sy, geo.sw, geo.sh, 0, 0, geo.W, geo.H);
      frames.push({ f: idx, img: toLumFromCanvas(geo.ctx, geo.W, geo.H) });
      perIdx[idx] = (perIdx[idx] || 0) + 1;
    }
    if (seeks % 60 === 0) {
      if (onStep && onStep(t) === false) break; // caller-driven abort (prefetch cancel)
      await new Promise(r => setTimeout(r, 0));
    }
  }
  return { frames, seeks, fBase };
}

/* The harvest decoder (file path): bootstrap-then-hop. Decode a bootstrap
   window, lock the carousel phase per ring, consult the ledger, seek-hop
   between UNKNOWN spans only (held droplets and banked headers price at
   zero), pool incrementally, and EARLY-EXIT the moment the peel completes —
   field34 decoded 64 s when the payload may have been in hand by 40. One
   window is planned at a time so every plan uses the freshest ledger. With
   no lock it degrades to a chunked classic pass (same coverage, nothing
   lost); with locks exhausted and the peel still short it sweeps what's
   unvisited before declaring the clip dry. */
async function harvestDecode(v, geo, file) {
  const profile = currentProfile(), R = profile.frame_rate_hz, capFps = captureFps();
  const HV = OC.harvest;
  const st = ensureStore();
  if (st.droplet_bits !== OC.fountain.geom(profile).dropletBits) {
    setStatus("store droplet_bits " + st.droplet_bits + " ≠ profile's " + OC.fountain.geom(profile).dropletBits + " — export or clear it first", "bad");
    return;
  }
  // THE LEASE (2026-08-23): a new clip clips every carried context (plates and
  // holds are clip-scoped facts; the same tag REBINDS on its first seal), the
  // operator's declared profile is the top degrade rung, provisionals are
  // clip-scoped. Contexts are tag-addressed; ledgers are content-addressed.
  HV.leaseNewClip(st);
  const lease = HV.leaseCreate({ operator: true });
  const peelAll = () => {
    const out = { list: [], allOk: true, any: false, best: null };
    for (const key in st.ledgers) {
      const p = HV.tryPeelStore(st, lease, key, profile);
      out.list.push({ key, p });
      if (p.ok === true) { out.any = true; if (!out.best) out.best = { key, p }; }
      else out.allOk = false;
    }
    if (!out.list.length) out.allOk = false;
    return out;
  };
  const peelBrief = (pa) => pa.list.map(({ key, p }) =>
    (key === "operator" ? "operator" : key) + " " +
    (p.ok === true ? "<span class='ok'>PEEL COMPLETE</span>"
      : p.K ? (p.recovered || 0) + "/" + p.K
      : "no header") +
    (p.provisionalsRejected ? " <span class='warn'>(" + p.provisionalsRejected + " provisional rejected)</span>" : "")
  ).join(" · ") || "no ledgers yet";
  const durS = v.duration, durF = Math.floor((durS - 0.06) * R);
  const baseline = Math.ceil(durS * capFps);
  // Window floor scales with the SLOWEST ring's droplet span. crcAlign needs
  // ≥2 CRC passes to lock, so a window has to offer the longest-droplet ring
  // several chances or one CRC miss costs it the whole window — measured: at
  // high-rate, base carries 24 symbols per droplet (M=4) against 10 for the
  // M=32 rings, i.e. ~2.5 droplets in an 8 s window, and it locked 2 of 3
  // windows where every other ring locked 3 of 3. Ask for 4 fresh droplets on
  // that ring, on top of the overlap back-pad (which re-covers old ground).
  const dropletF = HV.maxDropletFrames(profile);   // == overlapF below, by construction
  const supplyMinF = 5 * dropletF;                 // 4 fresh droplets + the overlap back-pad
  const userMinF = Math.round((+$("m_minwin").value || 8) * R);
  const minWinF = Math.max(userMinF, supplyMinF), joinGapF = Math.round(1.5 * R);
  const maxWinF = Math.max(Math.round(Math.max(+$("m_maxwin").value || 12, (+$("m_minwin").value || 8) + 2) * R),
                           minWinF + Math.round(2 * R));
  const chunkF = Math.round(10 * R);
  // One max-droplet span: the overlap unit (run-1's edge-truncation lesson) —
  // every follow-on window starts this early so no slot straddles uncovered.
  const overlapF = HV.maxDropletFrames(profile);
  const bootF = Math.min(Math.max(minWinF, Math.round((+$("m_boot").value || 10) * R)), durF);
  const t0Wall = performance.now();
  const visited = [], ctxLocks = {}, grown = {};
  let seeks = 0, wrun = 0, pa = peelAll();
  // Windows worth seeking, planned per (context locks × its content ledger),
  // earliest first; contexts whose ledger already peels plan nothing.
  const nextPlanned = (visitedArr) => {
    let bestW = null;
    const okKeys = {};
    pa.list.forEach(({ key, p }) => { if (p.ok === true) okKeys[key] = true; });
    for (const key in ctxLocks) {
      const lk = Object.values(ctxLocks[key]);
      if (!lk.length) continue;
      const ledKey = key === "operator" ? "operator" : (st.contexts[key] && st.contexts[key].contentKey);
      const led2 = ledKey && st.ledgers[ledKey];
      if (!led2 || okKeys[ledKey]) continue;
      const pl = HV.planSpans(led2, lk, 0, durF,
        { visited: visitedArr, minFrames: minWinF, joinGap: joinGapF, maxFrames: maxWinF, overlap: overlapF });
      if (pl.windows.length && (!bestW || pl.windows[0][0] < bestW[0])) bestW = pl.windows[0];
    }
    return bestW;
  };
  const clipLog = { name: file.name, windows: [] };
  st.clips.push(clipLog);
  $("harvest").innerHTML = "<b>harvest: " + file.name + "</b> — " + durS.toFixed(1) + " s, baseline " + baseline +
    " seeks, overlap " + (overlapF / R).toFixed(1) + " s, window floor " + (minWinF / R).toFixed(1) + " s" +
    (minWinF > userMinF ? " <span class='warn'>(raised from " + (userMinF / R).toFixed(1) +
      " s — the slowest ring needs " + (dropletF / R).toFixed(1) + " s per droplet)</span>" : "") + "<br>";
  // Already in hand? Then nothing is seeked at all — the carried store
  // completes before the clip is touched (never pay twice for the same drop).
  const queue = (pa.any && pa.allOk) ? [] : [[0, bootF]];
  if (pa.any && pa.allOk) $("harvest").innerHTML += "<span class='ok'>carried store already peels — the clip is not needed</span><br>";
  // Tier-1 seek∥decode overlap (parallel-harvest design note): the video
  // element is idle while the worker decodes, so the PROVISIONAL next window
  // seeks underneath the current decode. Any unvisited span is safe to decode
  // (droplets bank by identity, visited marks truthfully) — the plan is
  // advisory, so a post-absorb divergence just cancels the prefetch with its
  // seeks counted honestly.
  let prefetch = null, prefetchCancel = false, everLocked = false, totalAdded = 0;
  // Hold-for-bank (practitioner's ruling 2026-08-27): the payload winning the
  // race must not forfeit identity — the a82 real-photon take reached 4/5
  // chunk indices and the early exit abandoned the bank with half the clip
  // unread. While any beacon bank is mid-assembly and PROGRESSING (a fresh
  // idx within the last HOLD_BANK_N windows), the harvest keeps taking
  // windows after the payload peels, capped at HOLD_BANK_CAP held windows.
  const HOLD_BANK_N = 2, HOLD_BANK_CAP = 4;
  const bankState = {};   // target → { have, freshW }
  let heldForBank = 0;
  while (queue.length) {
    const [wf0, wf1] = queue.shift();
    wrun++;
    let cap;
    if (prefetch && prefetch.wf0 === wf0 && prefetch.wf1 === wf1) {
      cap = await prefetch.p; prefetch = null;
    } else {
      if (prefetch) { // divergent prefetch (growth or plan change) — cancel, count, drop
        prefetchCancel = true;
        const cPre = await prefetch.p;
        seeks += cPre.seeks; prefetch = null; prefetchCancel = false;
      }
      cap = await seekWindow(v, geo, wf0 / R, wf1 / R, capFps, R,
        t => setStatus("harvest w" + wrun + ": seeking " + t.toFixed(1) + " s…", "warn"));
    }
    seeks += cap.seeks;
    clipLog.windows.push([Math.round(wf0 / R * 10) / 10, Math.round(wf1 / R * 10) / 10]);
    // Hints only when exactly ONE clock is live (the deferral): with several
    // independent contexts one hint map would be wrong for all but one, and a
    // wrong hint costs a wasted narrow scan before the full one anyway.
    const liveLockKeys = Object.keys(ctxLocks).filter(k => Object.keys(ctxLocks[k]).length);
    const hints = {};
    if (liveLockKeys.length === 1)
      for (const k in ctxLocks[liveLockKeys[0]]) {
        const h = HV.predictLag(ctxLocks[liveLockKeys[0]][k], cap.fBase);
        if (h) hints[k] = h;
      }
    // Tag confirmation (the hold matrix's identity heartbeat): with exactly
    // one live announced context, ask the beacon channel to confirm its tag
    // between envelope seals.
    const liveTags = Object.keys(st.contexts).filter(t => st.contexts[t].state !== "clipped");
    setStatus("harvest w" + wrun + ": decoding " + cap.frames.length + " frames" +
      (getWorker() ? " (off-thread)" : "") + "…", "warn");
    const isV3h = !!(profile.bands && profile.plate);
    const decodeP = decodeAsync(cap.frames, profile, {
      aligned: false, handheld: $("m_hand").checked,
      loopSeconds: +$("m_loop").value || 60,
      mirror: { receive: false },
      maxEmitters: isV3h ? 6 : 4,
      payload: true, alignHints: hints,
      // the per-frame solve was wired into the plain path only — the harvest
      // (where angled captures actually live) never got it; field 1-up run
      // showed the cost: k1 SNR +7 dB over the ladder, zero CRC passes
      plateSolve: isV3h && $("m_solve").checked,
      // the beacon was plain-path only too, and could only preamble-lock — so
      // the envelope had never been read from a field capture. With the
      // framing-based aligner it joins mid-loop like everything else.
      beacon: isV3h && $("m_beacon").checked,
      beaconAlign: liveTags.length === 1 ? { expectTag: liveTags[0] } : undefined
    });
    // kick the provisional next window's seeks under the decode
    if (!queue.length && !prefetch) {
      const visProv = visited.map(s => s.slice());
      HV.markVisited(visProv, wf0, wf1);
      const nxt = nextPlanned(visProv) || HV.nextUnvisited(visProv, 0, durF, chunkF, overlapF);
      if (nxt && nxt[1] - nxt[0] >= Math.round(2 * R)) {
        const pw = wrun;
        prefetch = {
          wf0: nxt[0], wf1: nxt[1],
          p: seekWindow(v, geo, nxt[0] / R, nxt[1] / R, capFps, R,
            t => prefetchCancel ? false
               : void setStatus("harvest w" + pw + ": decoding ∥ prefetching " + t.toFixed(1) + " s…", "warn"))
        };
      }
    }
    const res = await decodeP;
    let line = "w" + wrun + " [" + (wf0 / R).toFixed(1) + "–" + (wf1 / R).toFixed(1) + " s] " + cap.seeks + " seeks";
    let lockedAny = false;
    if (res.error) line += " — <span class='bad'>" + res.error + "</span>";
    else {
      const got = HV.leaseObserve(st, lease, res, profile, wrun);
      let added = 0, dup = 0, quarantined = 0, conflicts = 0;
      got.events.forEach(e => {
        if (e.ev === "bank") { added += e.added || 0; dup += e.dup || 0; quarantined += e.quarantined || 0; conflicts += e.conflicts || 0; }
        if (e.ev === "chunk-bank") {
          const bs = bankState[e.target] || (bankState[e.target] = { have: 0, freshW: -1 });
          bs.have = e.have || 0;
          if (e.fresh > 0) bs.freshW = wrun;
        }
        if (e.ev === "bank-seal" || e.ev === "bind" || e.ev === "rebind") {
          for (const t in bankState) bankState[t].have = 5;  // assembled — nothing left to hold for
        }
      });
      totalAdded += added;
      // Locks per context/operator clock (the routing already knows whose
      // emitter each row belongs to); the lag-consensus quarantine still
      // gates each lock, per emitter, in FRAMES.
      got.obs.forEach(o => {
        const key = o.ctx ? o.ctx.tag : (o.operator ? "operator" : null);
        for (const a of (o.em.annuli || [])) {
          if (!a || a.beacon || a.alignLag == null) continue;
          lockedAny = true;
          if (!key) continue;
          const paF = profile.annuli.find(x => x.index === a.annulus);
          const Fa = (paF && paF.rotation.frames_per_symbol) || 4;
          if (o.lagConsensus != null && Math.abs(a.alignLag * Fa - o.lagConsensus) > Fa) continue;
          const lk = paF && HV.lockFrom(a, paF, profile, cap.fBase);
          if (lk) (ctxLocks[key] || (ctxLocks[key] = {}))[a.annulus] = lk;
        }
      });
      if (lockedAny) everLocked = true;
      pa = peelAll();
      // The beacon's envelope, read off the air: the emitter's own statement of
      // preset / session / K / tiling / loop — the settings string, from the wire.
      for (const em of res.emitters) for (const a of (em.annuli || [])) {
        if (!a || !a.beacon) continue;
        const f = a.envelopeFields;
        if (f && a.envelope)
          line += " — <span class='ok'>ENVELOPE " + a.alignMethod + (a.framing === "chunked" ? " CHUNKED tag " + a.tag + (a.tagSightings ? " ×" + a.tagSightings : "") : "") +
            (a.folded ? " (folded, repeats agree " + Math.round((a.foldAgree || 0) * 100) + "% of " + a.foldCompared + ")" : "") +
            ": " + f.preset + " session " + f.session32.toString(16).padStart(8, "0") +
            " K=" + f.K + " len=" + f.len + " tiling=" + f.tiling +
            (f.tiling > 1 ? " (grid " + f.grid.cols + "×" + f.grid.rows + ", carried by tile " + f.tile + ")" : "") +
            " loop=" + f.loop_s + "s freeze=" + f.freeze_s + "s</span>";
        else if (a.tagConfirmed)
          line += " — <span class='ok'>TAG " + a.tag + " confirmed ×" + (a.tagSightings || 1) + "</span>";
        else if (a.envelope)
          line += " — <span class='warn'>beacon frame " + a.envelope + " (unparsed)</span>";
      }
      // The lease's receipt stream: binds, adoptions, holds ending, clips.
      const leaseBits = got.events.filter(e => e.ev !== "bank" && e.ev !== "ledger" && e.ev !== "state")
        .map(e => {
          if (e.ev === "bind") return "<span class='ok'>BIND " + e.tag + " (session " + (e.session >>> 0).toString(16) + " → " + e.key + ")</span>";
          if (e.ev === "rebind") return "<span class='ok'>REBIND " + e.tag + "</span>";
          if (e.ev === "operator-merge") return "<span class='ok'>operator ledger adopted → " + e.key + " (" + e.moved + " moved" + (e.conflicts ? ", " + e.conflicts + " conflicts" : "") + ")</span>";
          if (e.ev === "adopt") return "<span class='ok'>provisional " + e.provisional + " adopted by " + e.tag + " (" + e.droplets + " droplets)</span>";
          if (e.ev === "provisional") return "<span class='warn'>un-announced plate → provisional " + e.id + "</span>";
          if (e.ev === "hold-end") return "<span class='warn'>hold ends (" + e.tag + ": tag lost, then a zero-lock window)</span>";
          if (e.ev === "all-lost") return "<span class='warn'>" + e.tag + " lost everything — grace</span>";
          if (e.ev === "clip") return "<span class='warn'>CLIP " + e.tag + " (grace expired)</span>";
          if (e.ev === "tile-disagree") return "<span class='bad'>tile disagree on " + e.tag + " (announced " + e.announced + " vs derived " + e.derived + ") — not banked</span>";
          if (e.ev === "chunk-bank") return "<span class='dim'>chunks +" + e.fresh + " fresh (bank " + e.have + "/5 idx → " + e.target + ")</span>";
          if (e.ev === "bank-seal") return "<span class='ok'>BANK SEAL " + e.tag + " — envelope assembled ACROSS windows</span>";
          return null;
        }).filter(Boolean);
      if (leaseBits.length) line += " — " + leaseBits.join(" · ");
      line += " — +" + added + " droplets (" + dup + " dup" +
        (quarantined ? ", <span class='warn'>" + quarantined + " quarantined</span>" : "") +
        (conflicts ? ", <span class='bad'>" + conflicts + " byte-conflicts</span>" : "") +
        ") — " + peelBrief(pa);
      $("results").innerHTML = layerSummary(res);
    }
    // Adaptive growth (run-1's lock-failure lesson): a window that locks
    // NOTHING gets one doubled retry before its stretch is declared dead —
    // short windows can't accumulate CRC evidence on marginal footage where
    // a long segment locks fine. The failed window is NOT marked visited
    // (the grown window re-covers it and marks for both).
    if (!lockedAny && !(pa.any && pa.allOk) && !grown[wf0] && wf1 < durF) {
      grown[wf0] = 1;
      const gw1 = Math.min(wf0 + 2 * (wf1 - wf0), durF);
      queue.unshift([wf0, gw1]);
      line += " — <span class='warn'>no lock, growing ×2 → " + (gw1 / R).toFixed(1) + " s</span>";
    } else {
      HV.markVisited(visited, wf0, wf1);
    }
    $("harvest").innerHTML += line + "<br>";
    ledgerInfo();
    // Early exit: every content ledger any live context (or the operator)
    // feeds has peeled and validated — UNLESS a beacon bank is mid-assembly
    // and progressing (hold-for-bank; identity is worth the extra windows).
    if (pa.any && pa.allOk) {
      const bankLive = Object.keys(bankState).some(t => {
        const bs = bankState[t];
        // Patience scales with proximity: at 4/5 every window holds ~1–2
        // occurrences of exactly the missing index, so a bank one index from
        // BIND gets the whole cap; farther banks get the short staleness bound.
        const staleBound = bs.have >= 4 ? HOLD_BANK_CAP : HOLD_BANK_N;
        return bs.have > 0 && bs.have < 5 && (wrun - bs.freshW) <= staleBound;
      });
      if (!bankLive || heldForBank >= HOLD_BANK_CAP) break;
      heldForBank++;
      const bh = Object.keys(bankState).map(t => bankState[t].have + "/5").join(", ");
      $("harvest").innerHTML += "<span class='warn'>payload complete — holding for the chunk bank (" + bh +
        " idx; held " + heldForBank + "/" + HOLD_BANK_CAP + ")</span><br>";
    }
    // Dead-clip guard: bootstrap + its growth + a second stretch all silent
    // on an empty take = stop burning seeks (the 29-minute exhaustion of a
    // clip where nothing ever locked). Anything carried in stays banked.
    if (!everLocked && totalAdded === 0 && wrun >= 4) {
      $("harvest").innerHTML += "<span class='bad'>nothing locks anywhere after " + wrun +
        " windows — stopping early. Check the EMIT side first (HUD skip receipt, mode summary green, payload K=… line), then range/zoom.</span><br>";
      break;
    }
    if (!queue.length) {
      const nxt2 = nextPlanned(visited) || HV.nextUnvisited(visited, 0, durF, chunkF, overlapF);
      if (nxt2 && (nxt2[1] - nxt2[0] >= Math.round(2 * R) || nxt2[1] - nxt2[0] >= minWinF)) queue.push(nxt2);
    }
  }
  if (prefetch) { // in-flight prefetch at exit — cancel, count its seeks honestly
    prefetchCancel = true;
    const cPre = await prefetch.p;
    seeks += cPre.seeks; prefetch = null;
  }
  const wall = ((performance.now() - t0Wall) / 1000).toFixed(1);
  const saved = Math.max(0, Math.round(100 * (1 - seeks / baseline)));
  const visitedS = visited.reduce((s, sp) => s + (sp[1] - sp[0]), 0) / R;
  pa = peelAll();
  const done = pa.any && pa.allOk;
  const payloads = pa.list.filter(({ p }) => p.ok === true).map(({ key, p }) =>
    "<span class='ok' style='font-size:15px'><b>PAYLOAD" + (pa.list.length > 1 ? " [" + (key === "operator" ? "operator" : key) + "]" : "") +
    ":</b> “" + p.text + "”</span> (" + p.recovered + "/" + p.K + " blocks, " + p.droplets + " droplets)").join("<br>");
  const receipt = done
    ? "<b class='ok'>EARLY EXIT — every live ledger in hand after " + visitedS.toFixed(1) + " s of " + durS.toFixed(1) + " s</b>" +
      " — " + seeks + " seeks of " + baseline + " baseline (" + saved + "% skipped), wall " + wall + " s<br>" + payloads
    : "<b class='warn'>clip exhausted — incomplete</b> (" + peelBrief(pa) +
      ") — " + seeks + " seeks of " + baseline + " (" + saved + "% skipped), wall " + wall + " s — export the store and film another take: the next harvest mines only what this one lacked" +
      (payloads ? "<br>" + payloads : "");
  $("harvest").innerHTML += receipt + "<br>";
  setStatus(done ? "harvest complete — early exit" : "harvest exhausted — the store holds the progress", done ? "ok" : "warn");
}

/* ---------- recorded input (§9.1 — first-class, works without camera/secure ctx) ----------
   Seek-stepped, crop-at-native-resolution. Browser-agnostic by construction: no
   rVFC dependence (Firefox lacks it — its rAF fallback jittered frame timing),
   and no 800 px downscale (which cost the phase margin that made laptop decodes
   work at 1200). Pre-scan finds the emitter; capture crops around it at source
   resolution (≤1280 wide), stepping exact 1/30 s seeks mapped to the 15 fps
   emission clock with duplicates kept (tear defense). In payload modes the
   HARVEST path replaces the whole-clip pass: it hops between unknown droplet
   spans and stops when the peel completes. */
$("fileIn").onchange = async () => {
  const file = $("fileIn").files[0];
  if (!file) return;
  // Guard (a field lesson — a mis-set selector burned a whole classic pass):
  // harvest needs a "+ payload" profile. A loaded ledger under a non-payload
  // profile is always a mistake — refuse before any seeking. Bare harvest-on
  // just warns and falls through to the classic pass (acuity work is normal).
  if ($("m_harvest").checked && !payloadMode()) {
    if (store && OC.harvest.storeCounts(store).droplets > 0) {
      setStatus("a store is loaded but the profile is not a payload mode — pick a “+ payload” profile, then re-choose the clip", "bad");
      $("fileIn").value = "";
      return;
    }
    $("harvest").innerHTML += "<span class='warn'>harvest is on but the profile has no payload — running the classic pass (pick a “+ payload” profile to harvest)</span><br>";
  }
  const v = $("vid");
  v.srcObject = null; v.src = URL.createObjectURL(file); v.style.display = ""; v.muted = true;
  const fps = currentProfile().frame_rate_hz;
  const seek = t => new Promise(r => { v.onseeked = () => r(); v.currentTime = t; });
  try {
    await new Promise((r, j) => { v.onloadedmetadata = () => r(); v.onerror = () => j(new Error("video failed to load")); });
    // Pre-scan: find the emitter's crop box at a few probe times (800 px is fine
    // for FINDING it; the capture itself then uses native resolution).
    setStatus("pre-scan: locating emitter…", "warn");
    const pc = document.createElement("canvas");
    const pctx = pc.getContext("2d", { willReadFrequently: true });
    const PW = 800, PH = Math.round(PW * v.videoHeight / v.videoWidth);
    pc.width = PW; pc.height = PH;
    // Union the emitter's position across ALL probe frames — handheld sway moves
    // it, and a crop fit to one instant silently clips boundary sectors later
    // (bilinear clamps at edges; no error, just poisoned samples). Margin 4.2
    // fiducial widths beyond the outermost annulus's ~3.0.
    // MULTI-SCALE (first-walk lesson): a distant/zoomed emitter that is invisible
    // at the 800 px downscale can be perfectly registrable at native resolution —
    // escalate the pre-scan scale until something registers.
    //
    // WIDENED 2026-08-22, on measurement. Registration has a working SCALE BAND
    // that depends on screen angle, and the bands do not nest — measured on the
    // 20/30/45 degree ladder, deterministic across every timestamp:
    //
    //   30 deg  1280 .. 1920   (fails at 1024 — plate too small)
    //   45 deg  1024 .. 1600   (fails at 1792+ — plate too LARGE, which is
    //                           backwards from every resolution intuition; the
    //                           rejection is an R-ratio gate in scoreHypothesis,
    //                           upstream of phiTol/bandContrastMin, and 45's phi
    //                           error is 0.295 against a 0.7 tolerance — the
    //                           swap-target's tilt-immunity is NOT the problem)
    //
    // Overlap: 1280-1600. The old ladder was [800, 1600, native] and broke on
    // first success, so it landed on 1600 — inside the overlap BY COINCIDENCE.
    // That accident is the only reason the 45 degree field clip decoded at all;
    // [800, 1920] would have failed it outright. 1280 is now an explicit rung so
    // the overlap is covered on purpose rather than by luck, and a second rung in
    // the band means one arbitrary constant no longer carries the angled case.
    // 800 stays first: it is the fast path and near head-on plates register there.
    // The plate's ACTUAL projected extent, in native pixels, from the registered
    // homography — not a proxy. fiducialWidthPx is ~3.0 units head-on but only
    // ~2.69 at 45 degrees, so a margin scaled in fiducial widths silently
    // shrinks relative to the plate exactly when tilt is steepest. Projecting
    // the plate's own outer reach (corner marks at 2.65 + r_out 0.40) is
    // pose-correct by construction, and at tilt the box hugs the ellipse.
    const PLATE_REACH_U = 3.05;
    // TILING: the decoder maps over ALL emitters and identifies the designated
    // tile by its breaker ring, so every tile must be inside the capture. A box
    // hugging ONE plate would take one tile and silently drop the rest. We do
    // not know WHICH tile a given detection is, so reach far enough that any
    // tile's box covers the whole lattice: (cols-1)*pitch on x, (rows-1)*pitch
    // on y. (The old flat 4.2*fid = 12.6 u covered 6-up only by accident, and
    // not reliably — a corner tile needs 3.05 + 2*7.2 = 17.45 u on x.)
    const tileLay = (OC.emission && OC.emission.tileLayout)
      ? OC.emission.tileLayout(currentProfile()) : { cols: 1, rows: 1, pitch: 0 };
    const REACH_X = PLATE_REACH_U + (tileLay.cols - 1) * (tileLay.pitch || 0);
    const REACH_Y = PLATE_REACH_U + (tileLay.rows - 1) * (tileLay.pitch || 0);
    // Rectangle perimeter, not a circle: with tiling the covered region is a
    // grid, and under a homography a straight edge stays straight, so sampling
    // the perimeter bounds the image exactly.
    const plateBBox = (em, sc) => {
      const Hm = em.H || (em.plate && em.plate.H);
      if (!Hm || !OC.geom || !OC.geom.applyH) return null;
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const edge = (ux, uy) => {
        const q = OC.geom.applyH(Hm, ux, uy);
        const X = q[0] * sc, Y = q[1] * sc;
        if (!isFinite(X) || !isFinite(Y)) return false;
        if (X < x0) x0 = X; if (X > x1) x1 = X;
        if (Y < y0) y0 = Y; if (Y > y1) y1 = Y;
        return true;
      };
      for (let i = 0; i <= 8; i++) {
        const t = -1 + 2 * i / 8;
        if (!edge(t * REACH_X, -REACH_Y) || !edge(t * REACH_X, REACH_Y) ||
            !edge(-REACH_X, t * REACH_Y) || !edge(REACH_X, t * REACH_Y)) return null;
      }
      return { x0, y0, x1, y1 };
    };
    // One shape for both probe passes — the sweep below used to build its hits
    // separately and so missed the bbox, silently falling back to the fid rule.
    const hitOf = (em, sc) => ({
      cx: ((em.corners.TL.x + em.corners.TR.x + em.corners.BL.x) / 3 + em.fiducialWidthPx * 0.14) * sc,
      cy: ((em.corners.TL.y + em.corners.TR.y + em.corners.BL.y) / 3 + em.fiducialWidthPx * 0.14) * sc,
      fid: em.fiducialWidthPx * sc,
      bb: plateBBox(em, sc)
    });
    let hits = [];
    for (const PWs of [800, 1280, 1600, Math.min(2200, v.videoWidth)]) {
      const PHs = Math.round(PWs * v.videoHeight / v.videoWidth);
      pc.width = PWs; pc.height = PHs;
      for (const t of [0.5, v.duration * 0.3, v.duration * 0.6, Math.max(0.5, v.duration - 1)]) {
        await seek(Math.min(t, v.duration - 0.1));
        pctx.drawImage(v, 0, 0, PWs, PHs);
        const reg = OC.register.registerAll(toLumFromCanvas(pctx, PWs, PHs), { profile: currentProfile() });
        // EVERY emitter, not just the first: a tiled emission registers one per
        // tile and the decoder maps over all of them.
        if (reg.emitters.length) {
          const sc = v.videoWidth / PWs;
          for (const em of reg.emitters) hits.push(hitOf(em, sc));
        }
      }
      if (hits.length) break;
    }
    // DENSER SWEEP ON FAILURE (2026-08-22). Four probe instants is thin: the
    // realistic remaining cause of a whole-clip pre-scan miss is not
    // detectability — the scale ladder and the saddle rung between them cover
    // that — but four unlucky instants (motion blur, an occluding hand, the rig
    // being adjusted). Losing the crop is expensive in a way that CANNOT be
    // recovered downstream: seekWindow stores every captured frame's luma at the
    // capture size, so the 1024-wide cap is load-bearing for memory (~590 KB per
    // frame, ~700 MB for a 20 s window already) and the uncropped path therefore
    // has to downscale the WHOLE frame — shrinking the emitter precisely when it
    // was already too hard to find. Cheaper to spend a few more seeks here than
    // to hand the harvest a capture the emitter cannot survive.
    // Only runs when everything above missed, so the common case pays nothing.
    if (!hits.length) {
      setStatus("pre-scan: nothing yet — sweeping more instants…", "warn");
      const dense = [];
      for (let i = 1; i <= 12; i++) dense.push(v.duration * i / 13);
      for (const PWs of [1280, Math.min(2200, v.videoWidth)]) {
        const PHs = Math.round(PWs * v.videoHeight / v.videoWidth);
        pc.width = PWs; pc.height = PHs;
        for (const t of dense) {
          await seek(Math.min(Math.max(0.1, t), v.duration - 0.1));
          pctx.drawImage(v, 0, 0, PWs, PHs);
          const reg = OC.register.registerAll(toLumFromCanvas(pctx, PWs, PHs), { profile: currentProfile() });
          if (reg.emitters.length) {
            const sc = v.videoWidth / PWs;
            for (const em of reg.emitters) hits.push(hitOf(em, sc));
          }
        }
        if (hits.length) break;
      }
    }
    let box = null;
    if (hits.length) {
      const fidMax = Math.max(...hits.map(h => h.fid));
      // ADAPTIVE MARGIN (2026-08-22). The old rule was a flat 4.2 x fid half-
      // width around the union of hit CENTRES. Measured: fiducialWidthPx is
      // ~3.0 units, i.e. roughly the plate's RADIUS, so 4.2 x fid = 12.6 units
      // against a plate reach of 3.05 — a box ~4.1x the plate in each direction,
      // ~17x its area. It made the capture 78-92% of the whole frame on near
      // clips, which the 1024 cap then converted straight into lost resolution.
      //
      // The union already absorbs sway: x0/x1 span min..max over hits, and the
      // margin sits ON TOP of that. So the margin never needed to carry sway —
      // only the plate itself, registration error, and motion BETWEEN the probe
      // instants (4, or 12 on the retry), which is the one thing the union
      // cannot see. Hence: union the plate's projected extents, then add slack
      // that scales with OBSERVED sway. Hold the emitter still and the box
      // collapses to the plate; hand it high-sway footage and the box grows to
      // keep everything, paying in capture area rather than in lost droplets.
      //
      // Falls back to the old fid rule if no hit yielded a homography, so a
      // registration path that reports corners but no H is not left worse off.
      const withBB = hits.filter(h => h.bb);
      const swayX = Math.max(...hits.map(h => h.cx)) - Math.min(...hits.map(h => h.cx));
      const swayY = Math.max(...hits.map(h => h.cy)) - Math.min(...hits.map(h => h.cy));
      const slack = 0.30 * fidMax + 0.50 * Math.max(swayX, swayY);
      const x0 = withBB.length ? Math.min(...withBB.map(h => h.bb.x0)) - slack
                               : Math.min(...hits.map(h => h.cx)) - fidMax * 4.2;
      const x1 = withBB.length ? Math.max(...withBB.map(h => h.bb.x1)) + slack
                               : Math.max(...hits.map(h => h.cx)) + fidMax * 4.2;
      const y0 = withBB.length ? Math.min(...withBB.map(h => h.bb.y0)) - slack
                               : Math.min(...hits.map(h => h.cy)) - fidMax * 4.2;
      const y1 = withBB.length ? Math.max(...withBB.map(h => h.bb.y1)) + slack
                               : Math.max(...hits.map(h => h.cy)) + fidMax * 4.2;
      const sx = Math.max(0, Math.round(x0)), sy = Math.max(0, Math.round(y0));
      box = { sx, sy, sw: Math.min(v.videoWidth - sx, Math.round(x1 - x0)), sh: Math.min(v.videoHeight - sy, Math.round(y1 - y0)), fid: fidMax };
    }
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d", { willReadFrequently: true });
    let sx = 0, sy = 0, sw = v.videoWidth, sh = v.videoHeight;
    if (box) ({ sx, sy, sw, sh } = box);
    // SCALE-FIX (2026-08-22): normalize the capture to a target FIDUCIAL size,
    // not a target crop width.
    //
    // The old rule was W = min(1024, sw). Because the crop is 8.4 x fid, the fid
    // CANCELS: eff_fid = fid * 1024 / (8.4 * fid) = 122, every time. Measured on
    // four clips: native fid 200 / 210 / 178 all arrived at the decoder as 122.
    // So the decoder was already being scale-normalized -- by accident, keyed to
    // the wrong quantity, and only while the margin happens to be 4.2 fid. Move
    // the camera closer and every extra pixel was discarded.
    //
    // Keying to the fiducial makes it deliberate and decouples it from the
    // margin -- which matters, because tightening the margin ALONE would raise
    // eff_fid (a 2 x fid half-margin puts the box under 1024, so no downscale at
    // all) and 45 degrees fails above ~167-187 fid. The margin can now change
    // without moving what the decoder sees.
    //
    // Downscaling is free: the scale already happens inside the same drawImage,
    // and getImageData, the luma loop, the stored bytes and the arc-pitch ray
    // count all shrink with it (same 2.4 px arc pitch, fewer rays -- the design
    // intent preserved). It also box-filters, trading surplus resolution for SNR.
    // Never UPSCALES: below the target the plate is simply smaller, down to the
    // ~75 px detection floor.
    //
    // 122 is the value the system has been running at, measured to work, and it
    // sits mid-bracket between that ~75 floor and 45's ~167 ceiling. Kept exactly
    // so this change moves the KEY, not the behaviour.
    const TARGET_FID_PX = 122;
    let W = Math.min(1024, sw);
    if (box && box.fid > 0)
      W = Math.max(64, Math.min(sw, 1024, Math.round(sw * TARGET_FID_PX / box.fid)));
    const H = Math.round(sh * W / sw);
    c.width = W; c.height = H;
    const geo = { ctx, sx, sy, sw, sh, W, H };
    const capFps = captureFps();
    if (payloadMode() && $("m_harvest").checked) {
      setStatus(box ? "emitter found — harvest begins (bootstrap first)…"
                    : "no emitter in pre-scan — harvesting uncropped…", "warn");
      await harvestDecode(v, geo, file);
    } else {
      setStatus(box ? ("emitter found — cropping " + sw + "×" + sh + " at native res, seek-stepping…")
                    : "no emitter in pre-scan — capturing uncropped (decode may still find it)…", "warn");
      const cap = await seekWindow(v, geo, 0, v.duration, capFps, fps,
        t => setStatus("seek-capture " + t.toFixed(1) + "/" + v.duration.toFixed(1) + " s…", "warn"));
      decodeFrames(cap.frames, "video-file-seek(" + file.name + ")", "seek" + capFps + (box ? "-crop" : ""));
    }
  } catch (e) { setStatus("file decode failed: " + e.message, "bad"); console.error(e); }
};

/* ---------- CSV + plot ---------- */
$("csvBtn").onclick = () => {
  if (!rows.length) { setStatus("no rows to export", "warn"); return; }
  const cols = Object.keys(rows[0]);
  const esc = s => '"' + String(s).replace(/"/g, '""') + '"';
  const csv = cols.join(",") + "\n" + rows.map(r => cols.map(cn => esc(r[cn])).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "acuity-" + Date.now() + ".csv";
  a.click();
};

function drawPlot() {
  const c = $("plot"), ctx = c.getContext("2d");
  ctx.fillStyle = "#0d0f12"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = "#444"; ctx.strokeRect(40, 10, c.width - 60, c.height - 40);
  ctx.fillStyle = "#9aa3ad"; ctx.font = "11px monospace";
  ctx.fillText("highest decoding layer vs range (m) — the acuity curve", 44, c.height - 8);
  const withRange = rows.filter(r => r.range_m !== "");
  if (!withRange.length) return;
  const maxR = Math.max(5, ...withRange.map(r => +r.range_m));
  for (let l = 0; l <= 3; l++) {
    const y = 10 + (c.height - 50) * (1 - l / 3);
    ctx.fillText(l === 3 ? "" : "L" + l, 20, y + 4);
  }
  withRange.forEach(r => {
    let top = -1;
    for (let a = 0; a < 3; a++) if (r["a" + a + "_ok"]) top = a;
    const x = 40 + (c.width - 60) * (+r.range_m / maxR);
    const y = 10 + (c.height - 50) * (1 - Math.max(top, 0) / 3);
    ctx.fillStyle = top < 0 ? "#ff8b8b" : "#7ce38b";
    ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
    ctx.fillStyle = "#9aa3ad";
    ctx.fillText(String(+r.range_m), x - 6, c.height - 22);
  });
}
drawPlot();
</script>
<script>
"use strict";
/* Settings-string intake: the emit page's "Copy for receiver" string
   configures profile, capture fps, loop seconds, and the v3.1 toggles in
   one paste — the mode-mismatch class of field errors (tonight's: a v3
   reference emission harvested in payload mode) dies at the UI layer. */
function ocApplySettings(str) {
  const t = (str || "").trim().split(/\s+/);
  if (t[0] !== "oc1") return { err: "unrecognized string (expected: oc1 key=value …)" };
  const kv = {};
  for (const p of t.slice(1)) { const i = p.indexOf("="); if (i > 0) kv[p.slice(0, i)] = p.slice(i + 1); }
  const pay = kv.payload === "1";
  const map = { "15": pay ? "v2p" : "v2",
                "v3": "v3", "v3hr": "v3hr", "v3i": "v3", "v3c": "v3c",
                // Trial-era strings resolve to the paced standard they always
                // meant (ruling 2026-08-23); v3f is the flat legacy opt-out.
                "v3p": "v3", "v3hrp": "v3hr", "v3f": "v3f" };  // v3i strings predate the flip
  const target = map[kv.prof];
  if (!target) return { err: "unknown prof \"" + kv.prof + "\"" };
  $("m_prof").value = target;
  if ($("m_prof").onchange) $("m_prof").onchange();
  if (kv.capfps) $("m_capfps").value = kv.capfps;
  if (kv.loop) $("m_loop").value = kv.loop;
  if ($("m_quad")) $("m_quad").checked = kv.quad === "1";
  if ($("m_qrp")) $("m_qrp").checked = kv.qrp === "1";
  if ($("m_dring")) $("m_dring").value = ["c42", "c82", "a42", "a42r", "a42x", "a82"].indexOf(kv.dring) >= 0 ? kv.dring : "f24";
  window.ocTiling = Math.max(1, +kv.tiling || 1);   // the declared lattice, applied in v31Opts
  const bits = [target, "capture " + (kv.capfps || "?") + " fps", (kv.tiling || "1") + "-up emitter"];
  if (kv.quad === "1") bits.push("quadrant corners");
  if (kv.qrp === "1") bits.push("persistent QR");
  if (["c42", "c82", "a42", "a42r", "a42x", "a82"].indexOf(kv.dring) >= 0)
    bits.push("D-ring " + (kv.dring[0] === "a" ? "A-INNER " : "") + "chunked " + (kv.dring[1] === "8" ? "M=8/F=2" : "M=4/F=2") +
      (kv.dring === "a42r" ? " · AMP RE-SPLIT" : kv.dring === "a42x" ? " · AMP k5 LADDER" : ""));
  const v3fam = kv.prof === "v3" || kv.prof === "v3hr" || kv.prof === "v3i" || kv.prof === "v3c" ||
                kv.prof === "v3p" || kv.prof === "v3hrp" || kv.prof === "v3f";
  const warn = v3fam && !pay;
  return {
    text: "applied:  " + bits.join("  ·  ") +
      (warn ? "  —  WARNING: v3 WITHOUT payload is a REFERENCE emission; harvest/payload decode will find NOTHING" : ""),
    warn: warn
  };
}
$("applyStrBtn").addEventListener("click", () => {
  const r = ocApplySettings($("pasteStr").value);
  const el = $("rxSummary");
  el.textContent = r.err ? r.err : r.text;
  el.style.background = r.err || r.warn ? "#3a2b12" : "#12331a";
  el.style.color = r.err || r.warn ? "#ffc46b" : "#7ce38b";
  el.style.fontWeight = r.err || r.warn ? "bold" : "normal";
});
$("pasteStr").addEventListener("keydown", e => { if (e.key === "Enter") $("applyStrBtn").click(); });
</script>
</body>
