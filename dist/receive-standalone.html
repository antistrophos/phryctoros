      if (!hasOdd) errors.push(tag + "all harmonics even — half-turn symmetry halves the slip bound (F5c); include an odd pilot");
      if (a.boundary.harmonics[0] !== 1) warnings.push(tag + "no k=1 pilot — the phase ladder loses its unambiguous anchor");

      if (a.r_inner + 0.03 > a.r0 - s - 0.08)

      if (i === 0 && p.fiducial.af_collar && p.fiducial.af_collar.r_out + 0.05 > a.r0 - s - 0.08)

      if (i === 0 && a.r_inner < fidCornerRadius + 0.03)

      var nomDeg = 360 * a.rotation.nominal_hz / fps;

      warnings.push("flicker: harmonic content lands in the 3–60 Hz band at contrast > 0.35 — drop contrast or slow rotation (F1)");

    return { ok: errors.length === 0, errors: errors, warnings: warnings, flicker: flicker };
  }

  /* The v1 emission contract, frozen: layer 0 innermost (the §7.1-diagram

  /* The 20 fps rate variant of v2 (walk-6 follow-on). Same geometry, same

  /* The 30 fps rate variant — REQUIRES 60 fps capture (the 24 fps design

  /* THE V3 CONTRACT (frozen 2026-08-16, corpus technical/phryctoros-v3-contract.md):

        // swap circle at 0.5·r_out carries sizing + phase-flip verify, and the

      beacon: {

        { index: 1, role: "mid" },           // B-outer
        { index: 2, role: "enhancement" },   // B-inner (close-range)
        { index: 3, role: "enhancement" }    // A-outer (close-range)

  function isV3(p) { return !!(p && p.bands && p.plate); }

  /* Resolve a band boundary ref to { r0, sum, edge } (sum = worst excursion). */
  function bandBoundary(p, ref) {
    if (ref.edge !== undefined) { var a = p.annuli[ref.edge]; return { r0: a.r0, sum: sumAmp(a), edge: a }; }
    return { r0: ref.fixed, sum: 0, edge: null };
  }

  /* The v3 validator. Geometry rules derive from the ACTUAL numbers (a probe
     variant with smaller amps passes on its own geometry); deviations from the
     frozen contract numbers warn rather than error, so §1's "amendments = v3.1"
     stays a human rule, not a code gate. */
  function validateV3(p) {
    var errors = [], warnings = [];
    var fps = p.frame_rate_hz;
    var halfSizeUnits = (p.render.size_px / 2) / p.render.scale_px_per_unit;
    var softU = p.render.edge_soft_px / p.render.scale_px_per_unit;
    var APPROACH_MIN = 0.20, PINCH_MIN = 0.23, CONTRACT_SUM = 0.090;

    for (var i = 0; i < p.annuli.length; i++) {
      var a = p.annuli[i], tag = "edge " + (a.edge || a.index) + ": ";
      var s = sumAmp(a);
      if (a.boundary.harmonics.length !== a.boundary.amplitudes.length ||
          a.boundary.harmonics.length !== a.boundary.phases_deg.length)
        errors.push(tag + "harmonics/amplitudes/phases_deg length mismatch");
      if (a.crossing !== "up" && a.crossing !== "down")
        errors.push(tag + "crossing must be 'up' or 'down'");
      var hasOdd = a.boundary.harmonics.some(function (k) { return k % 2 === 1; });
      if (!hasOdd) errors.push(tag + "all harmonics even — half-turn symmetry halves the slip bound (F5c)");
      if (a.boundary.harmonics[0] !== 1)
        errors.push(tag + "k=1 pilot must lead the ladder (the pose-trap anchor, field-priced)");
      else if (a.boundary.amplitudes[0] < 0.030 - 1e-9)
        warnings.push(tag + "k=1 pilot " + a.boundary.amplitudes[0] + " under 0.030 — below the field-priced pose-trap margin (the 0.020 ring was the wander's first victim)");
      if (Math.abs(s - CONTRACT_SUM) > 1e-9)
        warnings.push(tag + "amplitude sum " + s.toFixed(3) + " ≠ frozen " + CONTRACT_SUM + " (contract sums are frozen by geometry, zero slack)");
      for (var j = 0; j < a.boundary.amplitudes.length; j++)
        if (a.boundary.amplitudes[j] * p.render.scale_px_per_unit < 1.5)
          warnings.push(tag + "harmonic k=" + a.boundary.harmonics[j] + " amplitude under ~1.5 px at this scale (accepted deliberately for the 0.012 tails — 6-up is the close mode)");
      var nomDeg = 360 * a.rotation.nominal_hz / fps;
      var devDeg = 180 / a.rotation.frames_per_symbol;
      var per = nomDeg + devDeg;
      if (per > 150) errors.push(tag + "per-frame advance " + per.toFixed(1) + "° breaks the slip bound");
      else if (per > 90) warnings.push(tag + "per-frame advance " + per.toFixed(1) + "° leaves little headroom");
    }

    // Trough guards: within-band pinch ≥ 0.23 (C sits exactly at the bound in

    for (var b = 0; b < p.bands.length; b++) {

      if (b > 0) {
        var prevHi = bandBoundary(p, p.bands[b - 1].hi);
        var approach = (lo.r0 - lo.sum) - (prevHi.r0 + prevHi.sum);
        if (approach < APPROACH_MIN - 1e-9)
          errors.push("trough " + p.bands[b - 1].name + "→" + band.name + " facing-edge approach " + approach.toFixed(3) + " under " + APPROACH_MIN);
      }
    }
    var outer = p.bands[p.bands.length - 1].hi;
    if (!outer.flat || Math.abs(outer.fixed - p.flat_circle_r) > 1e-9)
      warnings.push("outermost boundary is not the flat units anchor — the self-anchoring gauge (units ≡ flat " + p.flat_circle_r + ") is the v3 identity");
    if (p.flat_circle_r + softU * 2 + 0.01 > halfSizeUnits)
      errors.push("flat circle " + p.flat_circle_r + " + soft margin exceeds render half-size " + halfSizeUnits.toFixed(3));

    // Plate containment (§5 as amended — the axis-containment repair is exactly
    // what this check exists to hold).
    var pl = p.plate;
    var beaconSum = 0;
    for (var k2 = 0; k2 < p.beacon.amplitudes.length; k2++) beaconSum += p.beacon.amplitudes[k2];
    if (pl.corners.at + pl.corners.r_out + softU > halfSizeUnits)
      errors.push("corner bullseye " + pl.corners.r_out + " at ±" + pl.corners.at + " fails axis containment (needs " + (pl.corners.at + pl.corners.r_out).toFixed(3) + " vs half-size " + halfSizeUnits.toFixed(3) + ")");
    if (Math.hypot(pl.corners.at, pl.corners.at) - pl.corners.r_out < p.flat_circle_r + 0.03)
      errors.push("corner bullseye intrudes on the flat circle + 0.03 margin");
    var cstyle = pl.corner_style || "bullseye";

      errors.push("plate.corner_style must be \"bullseye\" (frozen v3) or \"quadrant\" (v3.1 amendment 2)");
    if (cstyle === "quadrant")
      warnings.push("corner_style quadrant is the v3.1 amendment-2 mark — pending the full v3.1 freeze; the frozen v3 contract's corners are bullseyes");
    if (pl.center.r_out + 0.02 > pl.breaker.r_in - beaconSum)
      errors.push("beacon excursion erodes the center-bullseye/breaker gap (0.60→0.70 must hold at worst wiggle)");
    if (pl.breaker.r_out + beaconSum > pl.quiet_r)
      errors.push("breaker + beacon excursion " + (pl.breaker.r_out + beaconSum).toFixed(3) + " exceeds the donut budget " + pl.quiet_r);
    var innermostLo = bandBoundary(p, p.bands[0].lo);
    if (pl.quiet_r + 0.15 > innermostLo.r0 - innermostLo.sum + 1e-9)
      errors.push("donut budget " + pl.quiet_r + " leaves under 0.15 quiet to the innermost band edge");

    // Beacon (§5): M ∈ {2,4}; amplitude bound keeps the ring's quiet gaps.
    if (p.beacon.rotation.M !== 2 && p.beacon.rotation.M !== 4)

        var armUnits = ((l1 + l2) / 2) / uMean;

        var score = Math.abs(cosang) + Math.abs(l1 - l2) / (l1 + l2);
        if (!best || score < best.score) best = { corner: P0, p1: P1, p2: P2, score: score };
      }
      if (best) out.push(best);
    }
    out.sort(function (a, b) { return a.score - b.score; });
    var final = [];
    for (var o = 0; o < out.length; o++) {
      var tr = out[o];
      var key = [tr.corner, tr.p1, tr.p2].map(function (p) { return Math.round(p.x) + "," + Math.round(p.y); }).sort().join("|");
      var members = [tr.corner, tr.p1, tr.p2];
      var clash = members.some(function (p) { return used[Math.round(p.x) + "," + Math.round(p.y)]; });
      if (clash) continue;
      members.forEach(function (p) { used[Math.round(p.x) + "," + Math.round(p.y)] = true; });
      final.push(tr);
      void key;
    }
    return final;
  }

  /* Orient a triple and build the canonical→image homography (affine; the 4th corner
     is parallelogram-completed — adequate near-frontal, refine later for steep warp). */
  function emitterFromTriple(tr) {
    var A = tr.corner, P1 = tr.p1, P2 = tr.p2;
    var cross = (P1.x - A.x) * (P2.y - A.y) - (P1.y - A.y) * (P2.x - A.x);
    var TR2 = cross > 0 ? P1 : P2;  // canonical (y down): TL→TR × TL→BL has positive cross
    var BL = cross > 0 ? P2 : P1;
    var chirality = 1;
    // (If both assignments were negative the frame is mirrored — registration still
    // returns a homography; C9 says the flip is CONFIG, never auto-detected. The
    // pipeline flips the frame before registration when mirror.receive is set.)
    var D = { x: TR2.x + BL.x - A.x, y: TR2.y + BL.y - A.y };
    var H = G().homographyFromPoints(
      [[-FC, -FC], [FC, -FC], [-FC, FC], [FC, FC]],
      [[A.x, A.y], [TR2.x, TR2.y], [BL.x, BL.y], [D.x, D.y]]
    );
    if (!H) return null;
    var unit = (A.unit + TR2.unit + BL.unit) / 3;
    return { H: H, moduleSizePx: unit, fiducialWidthPx: unit * 25, chirality: chirality, corners: { TL: A, TR: TR2, BL: BL } };
  }

  /* Decoy-robust triple verification: geometry alone accepts fakes (ring chords,
     collars, clutter — two incidents in one evening). The fiducial's TIMING
     pattern (row/col 6, alternating dark/light between finders) is a signature
     no decoy carries: sample the 18 timing cells through the candidate H,
     self-normalize (C2 posture), and score the alternation. */
  function timingScore(img, H) {
    var g = G();
    var vals = [], expected = [];
    for (var t = 8; t <= 16; t++) {
      var cx = -0.5 + (t + 0.5) / 25, cy = -0.5 + 6.5 / 25;
      var p1 = g.applyH(H, cx, cy);
      vals.push(g.bilinear(img, p1[0], p1[1])); expected.push(t % 2 === 0);
      var p2 = g.applyH(H, -0.5 + 6.5 / 25, -0.5 + (t + 0.5) / 25);
      vals.push(g.bilinear(img, p2[0], p2[1])); expected.push(t % 2 === 0);
    }
    var lo = Infinity, hi = -Infinity;
    for (var i = 0; i < vals.length; i++) { if (vals[i] < lo) lo = vals[i]; if (vals[i] > hi) hi = vals[i]; }
    if (hi - lo < 1e-6) return 0;
    var mid = (lo + hi) / 2, match = 0;
    for (var j = 0; j < vals.length; j++) if ((vals[j] < mid) === expected[j]) match++;
    return match / vals.length;
  }

  /* Blur-tolerant structure check: the 3 finder centres must read DARK against
     the quiet zone's LIGHT — low-frequency features that survive heavy blur
     (the timing cells do not; σ2.4 erases their alternation). */
  function structureScore(img, H) {
    var g = G();
    var pts = [
      [-FC, -FC, true], [FC, -FC, true], [-FC, FC, true],          // finder centres: dark
      [0.58, 0, false], [-0.58, 0, false], [0, 0.58, false], [0, -0.58, false] // quiet: light
    ];
    var vals = [], lo = Infinity, hi = -Infinity;
    for (var i = 0; i < pts.length; i++) {
      var p = g.applyH(H, pts[i][0], pts[i][1]);
      var v = g.bilinear(img, p[0], p[1]);
      vals.push(v);
      if (v < lo) lo = v; if (v > hi) hi = v;
    }
    if (hi - lo < 1e-6) return 0;
    var mid = (lo + hi) / 2, match = 0;
    for (var j = 0; j < pts.length; j++) if ((vals[j] < mid) === pts[j][2]) match++;
    return match / pts.length;
  }

  /* ================= Ring registration (finder-less fallback) =================
     Walks 4–5 proved the failure order: the 25-module fiducial dies first
     (module-scale smear / geometric floor) while the RINGS — ten times
     coarser — stay perfectly legible. So register on the rings themselves:
       1. VOTE for centers: every circular edge's gradient ray passes through
          the center regardless of polarity or rotation; straight-edge clutter
          spreads into ridges, concentric structure into point peaks.
       2. SCALE from the radial profile: the three dark bands at the profile's
          known radii are a coarse, specific signature (the radial cousin of
          1:1:3:1:1), matched by normalized correlation over log-spaced scales.
       3. VERIFY per the decoy discipline: band-vs-gap darkness coverage over
          the full circle — a clock face or bezel ghost has no such profile.
       4. REFINE with the emission's own physics: the measured k=1 boundary
          coefficient IS the centering error (F5b's diagnostic becomes the
          corrector), and the mean radius calibrates scale.
     Rotation is deliberately unresolved: DPSK differencing absorbs a constant
     roll, so the similarity H uses rotation 0. Mirror stays config (C9).
     Limitation: the outer ring must lie mostly in frame. */

  function SAMP() { return (typeof module !== "undefined" && module.exports) ? require("./sample.js") : global.OC.sample; }

  function ringRegisterAll(img, profile, opts) {
    opts = opts || {};
    var maxE = opts.maxEmitters || 4;
    var annuli = profile.annuli;
    // Dark-band spans + the outer radius + the refine target. v2: annuli ARE
    // bands (r_inner→r0), outer ring's modulated boundary refines. v3: annuli
    // are EDGES — bands come from profile.bands at nominal radii, and the
    // refine target is THE FLAT CIRCLE at 3.00 (the units anchor, §4: measured
    // every frame with no modulation to average — sampleBoundary with an empty
    // harmonic set and sum 0 is exactly that gauge).
    var isV3 = !!(profile.bands && profile.plate);
    var spans, rOutU, refineA, refineR;
    if (isV3) {
      spans = profile.bands.map(function (b) {
        var lo = b.lo.edge !== undefined ? annuli[b.lo.edge].r0 : b.lo.fixed;
        var hi = b.hi.edge !== undefined ? annuli[b.hi.edge].r0 : b.hi.fixed;
        return [lo, hi];
      });
      rOutU = profile.flat_circle_r;
      refineR = rOutU;
      // amplitudes here only widen sampleWindow's search span (±0.14): the
      // NCC scale grid steps ~3%, and a 3% error puts the crossing outside a
      // bare ±0.08 window. The circle itself is unmodulated.
      refineA = { r0: rOutU, crossing: "up", boundary: { harmonics: [], amplitudes: [0.06], phases_deg: [] } };
    } else {
      spans = annuli.map(function (a) { return [a.r_inner, a.r0]; });
      var outerA = annuli[annuli.length - 1];
      rOutU = outerA.r0;
      refineR = rOutU;
      refineA = outerA;
    }

    // --- decimate for the vote/profile passes ---
    var dec = Math.max(1, Math.ceil(Math.max(img.w, img.h) / 640));
    var W = Math.floor(img.w / dec), H = Math.floor(img.h / dec);
    if (W < 32 || H < 32) return [];
    var lum = new Float64Array(W * H);
    for (var y = 0; y < H; y++)
      for (var x = 0; x < W; x++) {
        var s0 = 0;
        for (var dy = 0; dy < dec; dy++)
          for (var dx = 0; dx < dec; dx++)
            s0 += img.data[(y * dec + dy) * img.w + (x * dec + dx)];
        lum[y * W + x] = s0 / (dec * dec);
      }

    // --- gradients + edge threshold (percentile of magnitude) ---
    var mags = [], gxA = new Float64Array(W * H), gyA = new Float64Array(W * H);
    for (var y2 = 1; y2 < H - 1; y2++)
      for (var x2 = 1; x2 < W - 1; x2++) {
        var i2 = y2 * W + x2;
        var gx = lum[i2 + 1] - lum[i2 - 1];
        var gy = lum[i2 + W] - lum[i2 - W];
        gxA[i2] = gx; gyA[i2] = gy;
        var m = Math.hypot(gx, gy);
        if (m > 0) mags.push(m);
      }
    if (mags.length < 100) return [];
    mags.sort(function (a, b) { return a - b; });
    var thrG = mags[Math.floor(mags.length * 0.92)];

    // --- center vote: walk both ways along the gradient line ---
    var acc = new Float64Array(W * H);
    var rMin = 5, rMax = 0.6 * Math.min(W, H);
    for (var y3 = 1; y3 < H - 1; y3++)
      for (var x3 = 1; x3 < W - 1; x3++) {
        var i3 = y3 * W + x3;
        var m3 = Math.hypot(gxA[i3], gyA[i3]);
        if (m3 < thrG) continue;
        var ux = gxA[i3] / m3, uy = gyA[i3] / m3;
        for (var t = rMin; t < rMax; t += 2) {
          for (var sgn = -1; sgn <= 1; sgn += 2) {
            var px = Math.round(x3 + sgn * ux * t), py = Math.round(y3 + sgn * uy * t);
            if (px >= 0 && px < W && py >= 0 && py < H) acc[py * W + px] += 1;
          }
        }
      }
    // light smooth (two 3×3 box passes)
    for (var pass = 0; pass < 2; pass++) {
      var sm = new Float64Array(W * H);
      for (var y4 = 1; y4 < H - 1; y4++)
        for (var x4 = 1; x4 < W - 1; x4++) {
          var a4 = 0;
          for (var oy = -1; oy <= 1; oy++) for (var ox = -1; ox <= 1; ox++) a4 += acc[(y4 + oy) * W + x4 + ox];
          sm[y4 * W + x4] = a4 / 9;
        }

    }

    // --- top-K peaks with suppression ---
    var peaks = [];
    var minSep = Math.max(24, Math.floor(0.12 * Math.min(W, H)));
    var work = new Float64Array(acc);
    for (var k2 = 0; k2 < maxE * 2 && peaks.length < maxE * 2; k2++) {
      var bi = -1, bv = 0;
      for (var i4 = 0; i4 < W * H; i4++) if (work[i4] > bv) { bv = work[i4]; bi = i4; }
      if (bi < 0 || bv <= 0) break;
      var pxk = bi % W, pyk = (bi - pxk) / W;
      peaks.push({ x: pxk, y: pyk, v: bv });
      for (var yy = Math.max(0, pyk - minSep); yy < Math.min(H, pyk + minSep); yy++)
        for (var xx = Math.max(0, pxk - minSep); xx < Math.min(W, pxk + minSep); xx++)
          work[yy * W + xx] = 0;
    }

    // --- per peak: radial profile → scale by template NCC → coverage verify ---
    var NANG = 48;
    var cosT = [], sinT = [];
    for (var a5 = 0; a5 < NANG; a5++) { cosT.push(Math.cos(2 * Math.PI * a5 / NANG)); sinT.push(Math.sin(2 * Math.PI * a5 / NANG)); }
    var bilin = function (fx, fy) {
      if (fx < 0 || fy < 0 || fx > W - 1.001 || fy > H - 1.001) return NaN;
      var x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
      var i0 = y0 * W + x0;
      return lum[i0] * (1 - tx) * (1 - ty) + lum[i0 + 1] * tx * (1 - ty) + lum[i0 + W] * (1 - tx) * ty + lum[i0 + W + 1] * tx * ty;
    };
    var inBand = function (u) {
      for (var bi2 = 0; bi2 < spans.length; bi2++)
        if (u >= spans[bi2][0] && u <= spans[bi2][1]) return true;
      return false;
    };
    var found = [];
    for (var p5 = 0; p5 < peaks.length && found.length < maxE; p5++) {
      var pk = peaks[p5];
      var rProfMax = Math.floor(0.7 * Math.min(W, H));
      var prof = new Float64Array(rProfMax + 1);
      for (var r5 = 2; r5 <= rProfMax; r5++) {
        var vals = [];
        for (var a6 = 0; a6 < NANG; a6++) {
          var v6 = bilin(pk.x + r5 * cosT[a6], pk.y + r5 * sinT[a6]);
          if (!isNaN(v6)) vals.push(v6);
        }
        if (vals.length < NANG * 0.5) { prof[r5] = NaN; continue; }
        vals.sort(function (a, b) { return a - b; });
        var lo6 = Math.floor(vals.length * 0.17), hi6 = Math.ceil(vals.length * 0.83), s6 = 0;
        for (var t6 = lo6; t6 < hi6; t6++) s6 += vals[t6];
        prof[r5] = s6 / (hi6 - lo6);
      }
      // scale search: NCC of two-level template over the emission's radial span
      var sMinC = 6, sMaxC = rProfMax / (rOutU + 0.15);
      if (sMaxC <= sMinC) continue;
      var best = null;
      for (var st = 0; st < 48; st++) {
        var sc = sMinC * Math.pow(sMaxC / sMinC, st / 47);
        var xs = [], ys = [];
        for (var r7 = Math.max(2, Math.round(0.7 * sc)); r7 <= Math.min(rProfMax, Math.round((rOutU + 0.12) * sc)); r7++) {
          if (isNaN(prof[r7])) continue;
          xs.push(inBand(r7 / sc) ? 1 : 0);
          ys.push(prof[r7]);
        }
        if (xs.length < 20) continue;
        var mx = 0, my = 0;
        for (var i7 = 0; i7 < xs.length; i7++) { mx += xs[i7]; my += ys[i7]; }
        mx /= xs.length; my /= ys.length;
        var num = 0, dx7 = 0, dy7 = 0;
        for (var i8 = 0; i8 < xs.length; i8++) {
          var ax = xs[i8] - mx, ay = ys[i8] - my;
          num += ax * ay; dx7 += ax * ax; dy7 += ay * ay;
        }
        // A near-FLAT profile makes normalized correlation meaningless (÷~0
        // variance → ±1 on noise) — the T17c false-positive. Real ink is a
        // 0.3-deep modulation; require material variance before correlating.
        var norm7 = img.norm || 1;
        if (dx7 <= 0 || Math.sqrt(dy7 / xs.length) / norm7 < 0.015) continue;
        var ncc = -num / Math.sqrt(dx7 * dy7); // bands are DARK: anticorrelation is the match
        if (!best || ncc > best.ncc) best = { s: sc, ncc: ncc };
      }
      if (!best || best.ncc < 0.5) continue;
      // Absolute modulation depth at the chosen scale: gap radii must be
      // MATERIALLY brighter than band radii (ink is 0.3 deep; ask for 0.04).
      var bSum = 0, bN = 0, gSum = 0, gN = 0;
      for (var rD = Math.max(2, Math.round(0.7 * best.s)); rD <= Math.min(rProfMax, Math.round((rOutU + 0.12) * best.s)); rD++) {
        if (isNaN(prof[rD])) continue;
        if (inBand(rD / best.s)) { bSum += prof[rD]; bN++; } else { gSum += prof[rD]; gN++; }
      }
      if (!bN || !gN) continue;
      if ((gSum / gN - bSum / bN) / (img.norm || 1) < 0.04) continue;
      // coverage: per annulus, band midpoint darker than the gap beyond it, per angle
      var covs = [], covSum = 0;
      var okCov = true;
      for (var a8 = 0; a8 < spans.length; a8++) {
        var sp8 = spans[a8];
        var rBand = ((sp8[0] + sp8[1]) / 2) * best.s;
        var gapU = a8 + 1 < spans.length ? (sp8[1] + spans[a8 + 1][0]) / 2 : sp8[1] + 0.35;
        var rGap = gapU * best.s;
        var hits = 0, tries = 0;
        for (var a9 = 0; a9 < NANG; a9++) {
          var vb = bilin(pk.x + rBand * cosT[a9], pk.y + rBand * sinT[a9]);
          var vg = bilin(pk.x + rGap * cosT[a9], pk.y + rGap * sinT[a9]);
          if (isNaN(vb) || isNaN(vg)) continue;
          tries++;
          if (vb < vg - 1e-9) hits++;
        }
        var cov = tries ? hits / tries : 0;
        covs.push(cov); covSum += cov;
        if (cov < 0.6) okCov = false;
      }
      if (!okCov || covSum / spans.length < 0.72) continue;

      // --- promote to full-res similarity H, then physics refinement ---
      var sFull = best.s * dec;
      var cxF = (pk.x + 0.5) * dec, cyF = (pk.y + 0.5) * dec;
      var mkH = function (cx, cy, s) { return [s, 0, cx, 0, s, cy, 0, 0, 1]; };
      var Hc = mkH(cxF, cyF, sFull);
      var samp = SAMP();
      for (var it = 0; it < 3; it++) {
        var sb = samp.sampleBoundary(img, Hc, refineA);
        if (sb.found < sb.N * 0.5) break;
        var n9 = 0, mean9 = 0;
        for (var i9 = 0; i9 < sb.N; i9++) if (!isNaN(sb.r[i9])) { mean9 += sb.r[i9]; n9++; }
        mean9 /= n9;
        var dxU = 0, dyU = 0;
        for (var i10 = 0; i10 < sb.N; i10++) {
          if (isNaN(sb.r[i10])) continue;
          var th10 = 2 * Math.PI * i10 / sb.N;
          dxU += (sb.r[i10] - mean9) * Math.cos(th10);
          dyU += (sb.r[i10] - mean9) * Math.sin(th10);
        }
        dxU *= 2 / n9; dyU *= 2 / n9;
        cxF += sFull * dxU; cyF += sFull * dyU;
        sFull *= mean9 / refineR;
        Hc = mkH(cxF, cyF, sFull);
        if (Math.abs(dxU) < 0.003 && Math.abs(dyU) < 0.003 && Math.abs(mean9 / refineR - 1) < 0.003) break;
      }
      // duplicate suppression vs already-found (full-res coords)
      var dup = false;
      for (var f10 = 0; f10 < found.length; f10++) {
        var g10 = found[f10];
        if (Math.hypot(g10.cx - cxF, g10.cy - cyF) < 1.5 * Math.max(sFull, g10.s)) { dup = true; break; }
      }
      if (dup) continue;
      found.push({ cx: cxF, cy: cyF, s: sFull, ncc: best.ncc, coverage: covSum / spans.length, H: Hc });
    }

    // --- emitter objects shaped like the finder path's ---
    var g = G();
    return found.map(function (f) {
      var mk = function (ux, uy) { var p = g.applyH(f.H, ux, uy); return { x: p[0], y: p[1], unit: f.s / 25 }; };
      return {
        H: f.H, moduleSizePx: f.s / 25, fiducialWidthPx: f.s, chirality: 1,
        corners: { TL: mk(-FC, -FC), TR: mk(FC, -FC), BL: mk(-FC, FC) },
        method: "rings", timingScore: f.coverage, structureScore: f.ncc
      };
    });
  }

  /* The stage-2 entry point: all emitters in the frame. Acceptance: rank all
     geometric triples by timing+structure; the BEST is accepted on structure
     alone (blur-tolerant — a real fiducial outranks ring/collar decoys whenever
     its timing resolves, and still verifies structurally when blur erases the
     timing). ADDITIONAL emitters (multi-emitter/§5.1, decoy-exposed) must pass
     the strict timing signature too. When the finder path comes up EMPTY and
     the caller supplied the emission profile, fall back to ring registration
     (the fiducial dies before the rings — walks 4–5). */
  function registerAll(img, opts) {
    opts = opts || {};

    // PRIMARY registration. The corner bullseyes sit at exactly a virtual
    // fiducial's TL/TR/BL layout (dark centers, right angle), so on a
    // multi-tile plate the finder scan can chance-accept decoy triples —
    // T23b caught two on the 6-up frame (the AF-collar decoy lesson, third
    // appearance). Rings first; the finder path remains the COUNTDOWN
    // assist — QR frames, the far-field envelope rung, where rings may die
    // while the QR still reads.
    var pV3 = opts.profile;
    var isV3reg = !!(pV3 && pV3.bands && pV3.plate);
    // v3.1 amendment 2: quadrant corners register SADDLE-FIRST — the
    // constellation solve is pose-free and projectively exact, so it is the
    // rung that survives angle (the interim envelope's 30°/45° walls). Single
    // plate only for now (the 6-up constellation rides the tile-keyed work);
    // any failure falls through to the rings/finder ladder unchanged.
    if (isV3reg && pV3.plate.corner_style === "quadrant" && !opts.noSaddles) {
      var layoutN = pV3.tiling || 1;
      if (layoutN <= 1) {
        var sres = SD().solve(img, pV3, opts.saddleOpts || {});
        if (sres) {
          var gS = G();
          var pC = gS.applyH(sres.H, 0, 0);
          var pX = gS.applyH(sres.H, pV3.flat_circle_r, 0);
          var pY = gS.applyH(sres.H, 0, pV3.flat_circle_r);

                      Math.hypot(pY[0] - pC[0], pY[1] - pC[1])) / 2;
          var mkS = function (ux, uy) { var pq = gS.applyH(sres.H, ux, uy); return { x: pq[0], y: pq[1], unit: sEff / 25 }; };
          var emS = {
            H: sres.H, moduleSizePx: sEff / 25, fiducialWidthPx: sEff, chirality: 1,
            corners: { TL: mkS(-FC, -FC), TR: mkS(FC, -FC), BL: mkS(-FC, FC) },
            method: "saddles", timingScore: sres.bandContrast, structureScore: 1 - sres.phiErr / 0.7
          };
          return { emitters: [emS], candidates: [], method: "saddles" };
        }
      }
    }
    // qr_persistent (diagnostic): the QR is guaranteed present, so the
    // finder path leads again (it is the perspective-capable one) and rings
    // return to being the fallback — the v2-proven order, deliberately.
    if (isV3reg && !pV3.qr_persistent && !opts.noRings) {
      var ringed3 = ringRegisterAll(img, pV3, opts);
      if (ringed3.length) return { emitters: ringed3, candidates: [], method: "rings" };
    }
    var cands = findFinderCandidates(img, opts);
    var triples = groupTriples(cands);
    var scored = [];
    for (var i = 0; i < triples.length; i++) {
      var e = emitterFromTriple(triples[i]);
      if (!e) continue;
      e.timingScore = timingScore(img, e.H);
      e.structureScore = structureScore(img, e.H);
      scored.push(e);
    }
    // v3 countdown frames: the envelope QR spans qr.width_units (≠ 1) in
    // plate units, but the triple's H maps QR-width units. Rescale so every
    // consumer keeps sampling in plate units — applyH(H', x, y) ≡
    // applyH(H, x/w, y/w).
    var p3 = opts.profile;
    if (p3 && p3.bands && p3.plate && p3.qr && p3.qr.width_units !== 1) {
      var w3 = p3.qr.width_units;

    row["a" + a + "_snr"] = A.snr_db ? Object.entries(A.snr_db).map(([k, v]) => k + ":" + v).join("|") : "";
  }
  rows.push(row);
  $("rowsN").textContent = rows.length + " rows";
  drawPlot();
}

function decodeFrames(frames, source, fpsMeasured) {
  const isV3 = v3Mode(), isAuto = $("m_prof").value === "v3a";
  const opts = {
    aligned: false, handheld: $("m_hand").checked,
    loopSeconds: +$("m_loop").value || 60,
    mirror: { receive: false }, maxEmitters: isV3 ? 6 : 4,
    payload: payloadMode(),
    plateSolve: isV3 && $("m_solve").checked,
    beacon: isV3 && $("m_beacon").checked
  };
  setStatus("decoding " + frames.length + " frames (" + currentProfile().profile_version + ")" +
    (getWorker() ? " — off-thread, UI stays live…" : "…"), "warn");
  decodeAsync(frames, currentProfile(), opts, isAuto).then(out => {
    let res = out, preset = null;
    if (isAuto && out && out.result !== undefined) {
      res = out.result;
      preset = out.preset;
      setStatus("auto-detect: preset " + (preset || "UNDETERMINED") + " (" + out.passes + " CRC passes)", preset ? "ok" : "warn");
    }
    $("results").innerHTML = (isAuto ? "<p class='" + (preset ? "ok" : "warn") + "'>auto-detect verdict: <b>" + (preset || "undetermined") + "</b></p>" : "") + layerSummary(res);
    logRow(res, source, fpsMeasured, frames.length);
    if (!isAuto) setStatus(res.error ? "decode failed: " + res.error : "decode complete", res.error ? "bad" : "ok");
  });
}

/* ---------- live camera (C1: needs secure context) ---------- */

    });

  } catch (e) { setStatus("camera failed: " + e.message + " (C1: HTTPS or localhost only — use the file path instead)", "bad"); }

$("capBtn").onclick = () => {
  const v = $("vid");
  const secs = Math.max(3, +$("capSecs").value || 8);
  const W = 800, H = Math.round(800 * v.videoHeight / v.videoWidth) || 450;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  camFrames = []; capturing = true;
  const fps = currentProfile().frame_rate_hz;
  const perIdx = {};
  const tEnd = performance.now() + secs * 1000;
  const t0Wall = performance.now();
  const times = [];
  setStatus("capturing " + secs + " s…", "warn");
  // Duplicates are DELIBERATE: the camera runs faster than the 15 fps emission,
  // so each emission frame gets ≥2 looks and the decoder keeps the tear-free one.
  function grab(now, meta) {
    if (!capturing) return;
    if (now >= tEnd) {
      capturing = false;
      const fpsMeas = times.length > 1 ? (1000 * (times.length - 1) / (times[times.length - 1] - times[0])).toFixed(1) : "?";
      decodeFrames(camFrames, "camera-live", fpsMeas);
      return;
    }
    const t = meta ? meta.mediaTime : (now - t0Wall) / 1000;
    const idx = Math.round(t * fps);
    if ((perIdx[idx] || 0) < 3) {
      ctx.drawImage(v, 0, 0, W, H);
      camFrames.push({ f: idx, img: toLumFromCanvas(ctx, W, H) });
      perIdx[idx] = (perIdx[idx] || 0) + 1;
    }
    times.push(now);
    if ("requestVideoFrameCallback" in v) v.requestVideoFrameCallback(grab);
    else requestAnimationFrame(grab);
  }
  if ("requestVideoFrameCallback" in v) v.requestVideoFrameCallback(grab);
  else requestAnimationFrame(grab);
};

/* ---------- the harvest ledger (cross-clip: it outlives the clip) ---------- */
let ledger = null;
function ensureLedger() {
  if (!ledger) ledger = OC.harvest.createLedger(currentProfile(), $("m_notes").value || null);
  return ledger;
}
function ledgerInfo() {
  if (!ledger) { $("ledInfo").textContent = "ledger: empty"; return; }
  const cn = OC.harvest.counts(ledger);
  $("ledInfo").textContent = "ledger: " + cn.droplets + " droplets / " + cn.rings + " rings" +
    (cn.header ? " / header K=" + ledger.header.K : " / no header") +
    (ledger.session ? " / session “" + ledger.session + "”" : "");
}
$("ledSaveBtn").onclick = () => {

  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([OC.harvest.serializeLedger(ledger)], { type: "application/json" }));
  a.download = "phryctoros-ledger-" + (ledger.session || "session") + ".json";
  a.click();
};
$("ledClearBtn").onclick = () => { ledger = null; ledgerInfo(); $("harvest").innerHTML = ""; };
$("ledIn").onchange = async () => {
  const f = $("ledIn").files[0];
  if (!f) return;

    ledger = OC.harvest.parseLedger(await f.text());

  } catch (e) { setStatus("ledger load failed: " + e.message, "bad"); }
};

/* Seek-capture one time-window [tA, tB) of the loaded clip at the capture
   cadence, cropped at native resolution. Frames carry LOCAL emission indices
   (0-based at the window's first emission frame) — the pipeline sees each
   window exactly like a capture that started there; the caller keeps fBase to
   place results on the clip's absolute axis. Returns the seek count: the
   harvest receipt's currency. */
async function seekWindow(v, geo, tA, tB, capFps, emitFps, onStep) {
  const seek = t => new Promise(r => { v.onseeked = () => r(); v.currentTime = t; });
  const fBase = Math.round(tA * emitFps);
  const frames = []; const perIdx = {}; let seeks = 0;
  const tEnd = Math.min(tB, v.duration - 0.05);
  for (let i = Math.ceil(tA * capFps); ; i++) {
    const t = i / capFps;
    if (t >= tEnd) break;
    await seek(t); seeks++;
    const idx = Math.round(t * emitFps) - fBase;
    if ((perIdx[idx] || 0) < 2) {
      geo.ctx.drawImage(v, geo.sx, geo.sy, geo.sw, geo.sh, 0, 0, geo.W, geo.H);
      frames.push({ f: idx, img: toLumFromCanvas(geo.ctx, geo.W, geo.H) });
      perIdx[idx] = (perIdx[idx] || 0) + 1;
    }
    if (seeks % 60 === 0) {
      if (onStep) onStep(t);
      await new Promise(r => setTimeout(r, 0));
    }
  }
  return { frames, seeks, fBase };
}

/* The harvest decoder (file path): bootstrap-then-hop. Decode a bootstrap
   window, lock the carousel phase per ring, consult the ledger, seek-hop
   between UNKNOWN spans only (held droplets and banked headers price at
   zero), pool incrementally, and EARLY-EXIT the moment the peel completes —
   field34 decoded 64 s when the payload may have been in hand by 40. One
   window is planned at a time so every plan uses the freshest ledger. With
   no lock it degrades to a chunked classic pass (same coverage, nothing
   lost); with locks exhausted and the peel still short it sweeps what's
   unvisited before declaring the clip dry. */
async function harvestDecode(v, geo, file) {
  const profile = currentProfile(), R = profile.frame_rate_hz, capFps = captureFps();
  const HV = OC.harvest;
  const led = ensureLedger();
  if (led.droplet_bits !== OC.fountain.geom(profile).dropletBits) {
    setStatus("ledger droplet_bits " + led.droplet_bits + " ≠ profile's " + OC.fountain.geom(profile).dropletBits + " — export or clear it first", "bad");
    return;
  }
  const durS = v.duration, durF = Math.floor((durS - 0.06) * R);
  const baseline = Math.ceil(durS * capFps);
  const minWinF = Math.round((+$("m_minwin").value || 8) * R), joinGapF = Math.round(1.5 * R);
  const maxWinF = Math.round(Math.max(+$("m_maxwin").value || 12, (+$("m_minwin").value || 8) + 2) * R);
  const chunkF = Math.round(10 * R);
  // One max-droplet span: the overlap unit (run-1's edge-truncation lesson) —
  // every follow-on window starts this early so no slot straddles uncovered.
  const overlapF = HV.maxDropletFrames(profile);
  const bootF = Math.min(Math.max(minWinF, Math.round((+$("m_boot").value || 10) * R)), durF);
  const t0Wall = performance.now();
  const visited = [], locks = {}, grown = {};
  let seeks = 0, wrun = 0, peel = HV.tryPeel(led, profile);
  const clipLog = { name: file.name, windows: [] };
  led.clips.push(clipLog);
  $("harvest").innerHTML = "<b>harvest: " + file.name + "</b> — " + durS.toFixed(1) + " s, baseline " + baseline + " seeks, overlap " + (overlapF / R).toFixed(1) + " s<br>";
  // Already in hand? Then nothing is seeked at all — the carried ledger
  // completes before the clip is touched (never pay twice for the same drop).
  const queue = peel.ok ? [] : [[0, bootF]];
  if (peel.ok) $("harvest").innerHTML += "<span class='ok'>carried ledger already peels — the clip is not needed</span><br>";
  while (queue.length) {
    const [wf0, wf1] = queue.shift();
    wrun++;
    const cap = await seekWindow(v, geo, wf0 / R, wf1 / R, capFps, R,
      t => setStatus("harvest w" + wrun + ": seeking " + t.toFixed(1) + " s…", "warn"));
    seeks += cap.seeks;
    clipLog.windows.push([Math.round(wf0 / R * 10) / 10, Math.round(wf1 / R * 10) / 10]);
    const hints = {};
    for (const k in locks) { const h = HV.predictLag(locks[k], cap.fBase); if (h) hints[k] = h; }
    setStatus("harvest w" + wrun + ": decoding " + cap.frames.length + " frames" +
      (getWorker() ? " (off-thread)" : "") + "…", "warn");
    const isV3h = !!(profile.bands && profile.plate);
    const res = await decodeAsync(cap.frames, profile, {
      aligned: false, handheld: $("m_hand").checked,
      loopSeconds: +$("m_loop").value || 60,
      mirror: { receive: false },
      maxEmitters: isV3h ? 6 : 4,
      payload: true, alignHints: hints,
      // the per-frame solve was wired into the plain path only — the harvest
      // (where angled captures actually live) never got it; field 1-up run
      // showed the cost: k1 SNR +7 dB over the ladder, zero CRC passes
      plateSolve: isV3h && $("m_solve").checked
    });
    let line = "w" + wrun + " [" + (wf0 / R).toFixed(1) + "–" + (wf1 / R).toFixed(1) + " s] " + cap.seeks + " seeks";
    let lockedAny = false;
    if (res.error) line += " — <span class='bad'>" + res.error + "</span>";
    else {
      const got = HV.absorb(led, res, profile);
      for (const em of res.emitters) for (const a of (em.annuli || [])) {
        if (a && a.alignLag != null) lockedAny = true;
        // A ring outvoted on lag is quarantined — no droplets banked above,
        // and no lock taken here (a false lock would poison the plan too).
        if (got.lagConsensus != null && a.alignLag != null && Math.abs(a.alignLag - got.lagConsensus) > 1) continue;
        const pa = profile.annuli.find(x => x.index === a.annulus);
        const lk = pa && HV.lockFrom(a, pa, profile, cap.fBase);
        if (lk) locks[a.annulus] = lk;
      }
      peel = HV.tryPeel(led, profile);
      line += " — +" + got.added + " droplets (" + got.dup + " dup" +
        (got.quarantined ? ", <span class='warn'>" + got.quarantined + " quarantined</span>" : "") +
        (got.conflicts ? ", <span class='bad'>" + got.conflicts + " byte-conflicts</span>" : "") +
        ") — " +
        (peel.ok ? "<span class='ok'>PEEL COMPLETE</span>"
                 : peel.K ? (peel.recovered || 0) + "/" + peel.K + " blocks"
                 : "no header yet");
      $("results").innerHTML = layerSummary(res);
    }
    // Adaptive growth (run-1's lock-failure lesson): a window that locks
    // NOTHING gets one doubled retry before its stretch is declared dead —
    // short windows can't accumulate CRC evidence on marginal footage where
    // a long segment locks fine. The failed window is NOT marked visited
    // (the grown window re-covers it and marks for both).
    if (!lockedAny && !peel.ok && !grown[wf0] && wf1 < durF) {
      grown[wf0] = 1;
      const gw1 = Math.min(wf0 + 2 * (wf1 - wf0), durF);
      queue.unshift([wf0, gw1]);
      line += " — <span class='warn'>no lock, growing ×2 → " + (gw1 / R).toFixed(1) + " s</span>";
    } else {
      HV.markVisited(visited, wf0, wf1);
    }
    $("harvest").innerHTML += line + "<br>";
    ledgerInfo();
    if (peel && peel.ok) break;
    if (!queue.length) {
      const plan = HV.planSpans(led, Object.values(locks), 0, durF,
        { visited, minFrames: minWinF, joinGap: joinGapF, maxFrames: maxWinF, overlap: overlapF });
      if (plan.windows.length) queue.push(plan.windows[0]);
      else {
        const nx = HV.nextUnvisited(visited, 0, durF, chunkF, overlapF);
        if (nx && nx[1] - nx[0] >= Math.round(2 * R)) queue.push(nx);
      }
    }
  }
  const wall = ((performance.now() - t0Wall) / 1000).toFixed(1);
  const saved = Math.max(0, Math.round(100 * (1 - seeks / baseline)));
  const visitedS = visited.reduce((s, sp) => s + (sp[1] - sp[0]), 0) / R;
  const receipt = peel && peel.ok
    ? "<b class='ok'>EARLY EXIT — payload in hand after " + visitedS.toFixed(1) + " s of " + durS.toFixed(1) + " s</b>" +
      " — " + seeks + " seeks of " + baseline + " baseline (" + saved + "% skipped), wall " + wall + " s<br>" +
      "<span class='ok' style='font-size:15px'><b>PAYLOAD:</b> “" + peel.text + "”</span> (" + peel.recovered + "/" + peel.K + " blocks, " + peel.droplets + " droplets)"
    : "<b class='warn'>clip exhausted — payload incomplete</b> (" +
      (peel && peel.K ? (peel.recovered || 0) + "/" + peel.K + " blocks" : "no header yet") +
      ") — " + seeks + " seeks of " + baseline + " (" + saved + "% skipped), wall " + wall + " s — export the ledger and film another take: the next harvest mines only what this one lacked";
  $("harvest").innerHTML += receipt + "<br>";
  setStatus(peel && peel.ok ? "harvest complete — early exit" : "harvest exhausted — ledger holds the progress", peel && peel.ok ? "ok" : "warn");
}

/* ---------- recorded input (§9.1 — first-class, works without camera/secure ctx) ----------
   Seek-stepped, crop-at-native-resolution. Browser-agnostic by construction: no
   rVFC dependence (Firefox lacks it — its rAF fallback jittered frame timing),
   and no 800 px downscale (which cost the phase margin that made laptop decodes
   work at 1200). Pre-scan finds the emitter; capture crops around it at source
   resolution (≤1280 wide), stepping exact 1/30 s seeks mapped to the 15 fps
   emission clock with duplicates kept (tear defense). In payload modes the
   HARVEST path replaces the whole-clip pass: it hops between unknown droplet
   spans and stops when the peel completes. */
$("fileIn").onchange = async () => {
  const file = $("fileIn").files[0];
  if (!file) return;
  // Guard (a field lesson — a mis-set selector burned a whole classic pass):
  // harvest needs a "+ payload" profile. A loaded ledger under a non-payload
  // profile is always a mistake — refuse before any seeking. Bare harvest-on
  // just warns and falls through to the classic pass (acuity work is normal).
  if ($("m_harvest").checked && !payloadMode()) {
    if (ledger && OC.harvest.counts(ledger).droplets > 0) {
      setStatus("a ledger is loaded but the profile is not a payload mode — pick a “+ payload” profile, then re-choose the clip", "bad");
      $("fileIn").value = "";
      return;
    }
    $("harvest").innerHTML += "<span class='warn'>harvest is on but the profile has no payload — running the classic pass (pick a “+ payload” profile to harvest)</span><br>";
  }
  const v = $("vid");
  v.srcObject = null; v.src = URL.createObjectURL(file); v.style.display = ""; v.muted = true;
  const fps = currentProfile().frame_rate_hz;
  const seek = t => new Promise(r => { v.onseeked = () => r(); v.currentTime = t; });
  try {
    await new Promise((r, j) => { v.onloadedmetadata = () => r(); v.onerror = () => j(new Error("video failed to load")); });
    // Pre-scan: find the emitter's crop box at a few probe times (800 px is fine
    // for FINDING it; the capture itself then uses native resolution).
    setStatus("pre-scan: locating emitter…", "warn");
    const pc = document.createElement("canvas");
    const pctx = pc.getContext("2d", { willReadFrequently: true });
    const PW = 800, PH = Math.round(PW * v.videoHeight / v.videoWidth);
    pc.width = PW; pc.height = PH;
    // Union the emitter's position across ALL probe frames — handheld sway moves
    // it, and a crop fit to one instant silently clips boundary sectors later
    // (bilinear clamps at edges; no error, just poisoned samples). Margin 4.2
    // fiducial widths beyond the outermost annulus's ~3.0.
    // MULTI-SCALE (first-walk lesson): a distant/zoomed emitter that is invisible
    // at the 800 px downscale can be perfectly registrable at native resolution —
    // escalate the pre-scan scale until something registers.
    let hits = [];
    for (const PWs of [800, 1600, Math.min(2200, v.videoWidth)]) {
      const PHs = Math.round(PWs * v.videoHeight / v.videoWidth);
      pc.width = PWs; pc.height = PHs;
      for (const t of [0.5, v.duration * 0.3, v.duration * 0.6, Math.max(0.5, v.duration - 1)]) {
        await seek(Math.min(t, v.duration - 0.1));
        pctx.drawImage(v, 0, 0, PWs, PHs);
        const reg = OC.register.registerAll(toLumFromCanvas(pctx, PWs, PHs), { profile: currentProfile() });
        if (reg.emitters.length) {
          const em = reg.emitters[0];
          const sc = v.videoWidth / PWs;
          hits.push({
            cx: ((em.corners.TL.x + em.corners.TR.x + em.corners.BL.x) / 3 + em.fiducialWidthPx * 0.14) * sc,
            cy: ((em.corners.TL.y + em.corners.TR.y + em.corners.BL.y) / 3 + em.fiducialWidthPx * 0.14) * sc,
            fid: em.fiducialWidthPx * sc
          });
        }
      }
      if (hits.length) break;
    }
    let box = null;
    if (hits.length) {
      const fidMax = Math.max(...hits.map(h => h.fid));
      const half = fidMax * 4.2;
      const x0 = Math.min(...hits.map(h => h.cx)) - half, x1 = Math.max(...hits.map(h => h.cx)) + half;
      const y0 = Math.min(...hits.map(h => h.cy)) - half, y1 = Math.max(...hits.map(h => h.cy)) + half;
      const sx = Math.max(0, Math.round(x0)), sy = Math.max(0, Math.round(y0));
      box = { sx, sy, sw: Math.min(v.videoWidth - sx, Math.round(x1 - x0)), sh: Math.min(v.videoHeight - sy, Math.round(y1 - y0)) };
    }
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d", { willReadFrequently: true });
    let sx = 0, sy = 0, sw = v.videoWidth, sh = v.videoHeight;
    if (box) ({ sx, sy, sw, sh } = box);
    const W = Math.min(1024, sw), H = Math.round(sh * W / sw);
    c.width = W; c.height = H;
    const geo = { ctx, sx, sy, sw, sh, W, H };
    const capFps = captureFps();
    if (payloadMode() && $("m_harvest").checked) {
      setStatus(box ? "emitter found — harvest begins (bootstrap first)…"
                    : "no emitter in pre-scan — harvesting uncropped…", "warn");
      await harvestDecode(v, geo, file);
    } else {
      setStatus(box ? ("emitter found — cropping " + sw + "×" + sh + " at native res, seek-stepping…")
                    : "no emitter in pre-scan — capturing uncropped (decode may still find it)…", "warn");
      const cap = await seekWindow(v, geo, 0, v.duration, capFps, fps,
        t => setStatus("seek-capture " + t.toFixed(1) + "/" + v.duration.toFixed(1) + " s…", "warn"));
      decodeFrames(cap.frames, "video-file-seek(" + file.name + ")", "seek" + capFps + (box ? "-crop" : ""));
    }
  } catch (e) { setStatus("file decode failed: " + e.message, "bad"); console.error(e); }
};

/* ---------- CSV + plot ---------- */
$("csvBtn").onclick = () => {
  if (!rows.length) { setStatus("no rows to export", "warn"); return; }
  const cols = Object.keys(rows[0]);
  const esc = s => '"' + String(s).replace(/"/g, '""') + '"';
  const csv = cols.join(",") + "\n" + rows.map(r => cols.map(cn => esc(r[cn])).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "acuity-" + Date.now() + ".csv";
  a.click();
};

function drawPlot() {
  const c = $("plot"), ctx = c.getContext("2d");
  ctx.fillStyle = "#0d0f12"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = "#444"; ctx.strokeRect(40, 10, c.width - 60, c.height - 40);
  ctx.fillStyle = "#9aa3ad"; ctx.font = "11px monospace";
  ctx.fillText("highest decoding layer vs range (m) — the acuity curve", 44, c.height - 8);
  const withRange = rows.filter(r => r.range_m !== "");
  if (!withRange.length) return;
  const maxR = Math.max(5, ...withRange.map(r => +r.range_m));
  for (let l = 0; l <= 3; l++) {
    const y = 10 + (c.height - 50) * (1 - l / 3);
    ctx.fillText(l === 3 ? "" : "L" + l, 20, y + 4);
  }
  withRange.forEach(r => {
    let top = -1;
    for (let a = 0; a < 3; a++) if (r["a" + a + "_ok"]) top = a;
    const x = 40 + (c.width - 60) * (+r.range_m / maxR);
    const y = 10 + (c.height - 50) * (1 - Math.max(top, 0) / 3);
    ctx.fillStyle = top < 0 ? "#ff8b8b" : "#7ce38b";
    ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
    ctx.fillStyle = "#9aa3ad";
    ctx.fillText(String(+r.range_m), x - 6, c.height - 22);
  });
}
drawPlot();
</script>
<script>
"use strict";
/* Settings-string intake: the emit page's "Copy for receiver" string
   configures profile, capture fps, loop seconds, and the v3.1 toggles in
   one paste — the mode-mismatch class of field errors (tonight's: a v3
   reference emission harvested in payload mode) dies at the UI layer. */
function ocApplySettings(str) {
  const t = (str || "").trim().split(/\s+/);
  if (t[0] !== "oc1") return { err: "unrecognized string (expected: oc1 key=value …)" };
  const kv = {};
  for (const p of t.slice(1)) { const i = p.indexOf("="); if (i > 0) kv[p.slice(0, i)] = p.slice(i + 1); }
  const pay = kv.payload === "1";
  const map = { "15": pay ? "v2p" : "v2", "20": pay ? "v20p" : "v20", "30": pay ? "v30p" : "v30", "v3": "v3", "v3hr": "v3hr" };
  const target = map[kv.prof];
  if (!target) return { err: "unknown prof \"" + kv.prof + "\"" };
  $("m_prof").value = target;
  if ($("m_prof").onchange) $("m_prof").onchange();
  if (kv.capfps) $("m_capfps").value = kv.capfps;
  if (kv.loop) $("m_loop").value = kv.loop;
  if ($("m_quad")) $("m_quad").checked = kv.quad === "1";
  if ($("m_qrp")) $("m_qrp").checked = kv.qrp === "1";
  const bits = [target, "capture " + (kv.capfps || "?") + " fps", (kv.tiling || "1") + "-up emitter"];
  if (kv.quad === "1") bits.push("quadrant corners");
  if (kv.qrp === "1") bits.push("persistent QR");
  const v3fam = kv.prof === "v3" || kv.prof === "v3hr";
  const warn = v3fam && !pay;
  return {
    text: "applied:  " + bits.join("  ·  ") +
      (warn ? "  —  WARNING: v3 WITHOUT payload is a REFERENCE emission; harvest/payload decode will find NOTHING" : ""),
    warn: warn
  };
}
$("applyStrBtn").addEventListener("click", () => {
  const r = ocApplySettings($("pasteStr").value);
  const el = $("rxSummary");
  el.textContent = r.err ? r.err : r.text;
  el.style.background = r.err || r.warn ? "#3a2b12" : "#12331a";
  el.style.color = r.err || r.warn ? "#ffc46b" : "#7ce38b";
  el.style.fontWeight = r.err || r.warn ? "bold" : "normal";
});
$("pasteStr").addEventListener("keydown", e => { if (e.key === "Enter") $("applyStrBtn").click(); });
</script>
</body>
</html>
